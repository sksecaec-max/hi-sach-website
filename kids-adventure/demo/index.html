<body>
  <!-- The whole app is rendered into #app by JavaScript.
       This keeps game logic out of markup so it can be reused in an Android WebView build. -->
  <div id="app" class="app">

    <!-- Boot splash, hidden once the first screen mounts -->
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash__logo">
        <span class="splash__mark">Little Explorers</span>
        <span class="splash__dot"></span>
      </div>
      <p class="splash__tag">Learn &amp; Play</p>
    </div>

    <!-- Persistent top bar (child header). Shown on non-fullscreen screens. -->
    <header id="topbar" class="topbar" hidden>
      <button id="btn-back" class="topbar__back" aria-label="Go back">‹</button>
      <div class="topbar__id">
        <button id="avatar-btn" class="avatar" aria-label="Your avatar"></button>
        <div class="topbar__text">
          <div id="greeting" class="topbar__greeting">Hi!</div>
          <div id="subgreeting" class="topbar__sub">Ready to play?</div>
        </div>
      </div>
      <div class="topbar__stats">
        <button id="btn-stars" class="star-count" aria-label="Stars earned. Open my rewards.">
          <span class="star-count__icon"><svg class="kido-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.6l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.4l-5.4 2.9 1.1-6.1L3.2 9l6.1-.8z" fill="#FFC23D" stroke="#E59A12" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
          <span id="star-total" class="star-count__num">0</span>
        </button>
        <button id="btn-music" class="topbar__music js-music-toggle" aria-label="Toggle music" title="Music: On"></button>
        <button id="btn-momo" class="topbar__music topbar__momo js-momo-toggle" aria-label="Hide Momo" title="Momo: On"></button>
        <button id="btn-parent" class="topbar__parent" aria-label="Parent area">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm0 2c-3 0-6 1.6-6 4.2V17h12v-2.8C18 11.6 15 10 12 10Z"/><circle cx="19" cy="6" r="3" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <!-- Screens mount here -->
    <main id="screen" class="screen" tabindex="-1"></main>

    <!-- Bottom navigation (child), shown on the home shell -->
    <nav id="tabbar" class="tabbar" hidden aria-label="Main sections"></nav>

    <!-- Overlay layers -->
    <div id="fx" class="fx-layer" aria-hidden="true"></div>
    <div id="toast" class="toast-layer" aria-live="polite"></div>
    <div id="mascot" class="mascot-layer" hidden></div>
    <div id="modal" class="modal-layer" hidden></div>
  </div>
