<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant 2D Triangle Gradient -->
    <linearGradient id="triGrad2D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#F45B69"/>
    </linearGradient>
    <linearGradient id="triInnerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Flat 2D Triangle Shape with gentle rounded vertices -->
  <path d="M 100 24 
           Q 106 32 174 162 
           Q 178 172 166 172 
           L 34 172 
           Q 22 172 26 162 
           Z" 
        fill="url(#triGrad2D)"/>

  <!-- Crisp Inner Border Accent -->
  <path d="M 100 38 
           L 160 162 
           L 40 162 
           Z" 
        fill="none" stroke="url(#triInnerStroke)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Friendly Accent Sparkle -->
  <circle cx="82" cy="98" r="5.5" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="92" cy="88" r="3" fill="#FFFFFF" opacity="0.8"/>
</svg>
