<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant 2D Pentagon Gradient -->
    <linearGradient id="pentGrad2D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="pentInnerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Flat 2D Regular Pentagon Shape -->
  <polygon points="100,28 172,81 145,166 55,166 28,81" fill="url(#pentGrad2D)" stroke="#6366F1" stroke-width="2" stroke-linejoin="round"/>

  <!-- Crisp Inner Border Accent -->
  <polygon points="100,38 163,86 139,158 61,158 37,86" fill="none" stroke="url(#pentInnerStroke)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Friendly Accent Sparkle -->
  <circle cx="76" cy="80" r="5.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="86" cy="70" r="3" fill="#FFFFFF" opacity="0.85"/>
</svg>
