<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant 2D Oval Gradient -->
    <linearGradient id="ovalGrad2D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="ovalInnerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Flat 2D Oval / Ellipse Shape -->
  <ellipse cx="100" cy="100" rx="58" ry="78" fill="url(#ovalGrad2D)" stroke="#7E22CE" stroke-width="2"/>

  <!-- Crisp Inner Border Accent -->
  <ellipse cx="100" cy="100" rx="51" ry="71" fill="none" stroke="url(#ovalInnerStroke)" stroke-width="3"/>

  <!-- Friendly Accent Sparkle -->
  <circle cx="78" cy="68" r="6" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="88" cy="57" r="3.2" fill="#FFFFFF" opacity="0.85"/>
</svg>
