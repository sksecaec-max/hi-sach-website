<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant 2D Circle Gradient -->
    <linearGradient id="circleGrad2D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF2B44"/>
    </linearGradient>
    <linearGradient id="circleInnerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Flat 2D Circle Shape -->
  <circle cx="100" cy="100" r="78" fill="url(#circleGrad2D)"/>
  
  <!-- Crisp Inner Border Accent -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#circleInnerStroke)" stroke-width="3"/>
  
  <!-- Subtle Friendly Specular Sparkle -->
  <circle cx="70" cy="65" r="7" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="82" cy="54" r="3.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
