<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant 2D Trapezium Gradient -->
    <linearGradient id="trapGrad2D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="trapInnerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Flat 2D Symmetrical Trapezium Shape -->
  <polygon points="54,46 146,46 182,158 18,158" fill="url(#trapGrad2D)" stroke="#E11D48" stroke-width="2" stroke-linejoin="round"/>

  <!-- Crisp Inner Border Accent -->
  <polygon points="60,54 140,54 172,150 28,150" fill="none" stroke="url(#trapInnerStroke)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Friendly Accent Sparkle -->
  <circle cx="72" cy="80" r="5.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="82" cy="70" r="3" fill="#FFFFFF" opacity="0.85"/>
</svg>
