<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft 3D Floor Shadow -->
    <radialGradient id="pyrFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451A03" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#451A03" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0"/>
    </radialGradient>

    <!-- Sunlit Left Face Gradient -->
    <linearGradient id="pyrLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Shaded Right Face Gradient -->
    <linearGradient id="pyrRightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="60%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Base Shadow Underside -->
    <linearGradient id="pyrBaseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <polygon points="100,188 174,162 100,146 26,162" fill="url(#pyrFloorShadow)"/>

  <!-- Left Sunlit Face -->
  <polygon points="100,26 30,136 100,168" fill="url(#pyrLeftFace)"/>

  <!-- Right Shaded Face -->
  <polygon points="100,26 100,168 170,136" fill="url(#pyrRightFace)"/>

  <!-- Crisp Central Ridge Highlight -->
  <line x1="100" y1="26" x2="100" y2="168" stroke="#FFEDD5" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Left Base Edge -->
  <line x1="30" y1="136" x2="100" y2="168" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Apex Specular Dot -->
  <circle cx="100" cy="26" r="3.2" fill="#FFFFFF"/>
</svg>
