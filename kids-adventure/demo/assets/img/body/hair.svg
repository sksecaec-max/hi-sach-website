<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowHair" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="35%" stop-color="#5D4037"/>
      <stop offset="75%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1B0000"/>
    </linearGradient>
    <linearGradient id="strandHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="50%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="178" rx="65" ry="12" fill="url(#shadowHair)"/>

  <!-- Main Hair Volume Shape -->
  <path d="M30 145 C25 90, 40 38, 100 35 C160 38, 175 90, 170 145 C155 125, 138 120, 115 128 C95 135, 75 132, 58 122 C48 135, 38 142, 30 145 Z"
        fill="url(#hairBase)"/>

  <!-- Flowing Front Bangs & Tufts -->
  <path d="M42 110 C55 65, 95 60, 100 85 C105 60, 145 65, 158 110 C145 92, 125 82, 100 92 C75 82, 55 92, 42 110 Z"
        fill="#4E342E"/>

  <!-- Glossy Sunlight Crown Reflection -->
  <path d="M55 72 C80 50, 120 50, 145 72" stroke="url(#strandHighlight)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M70 58 C90 44, 110 44, 130 58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Individual Soft Strands -->
  <path d="M50 120 Q65 95 80 125" stroke="#8D6E63" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M120 125 Q135 95 150 120" stroke="#8D6E63" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
