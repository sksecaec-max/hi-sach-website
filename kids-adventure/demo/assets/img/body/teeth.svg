<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Contact Shadow -->
    <radialGradient id="toothShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Realistic Enamel Volumetric Gradient -->
    <radialGradient id="enamelGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="95%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>

    <!-- Toothbrush Bristles Gradient -->
    <linearGradient id="bristlesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Fresh Mint Toothpaste Swirl -->
    <linearGradient id="pasteSwirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="100" cy="180" rx="64" ry="14" fill="url(#toothShadow)"/>

  <!-- ================= Realistic Molar Tooth Anatomy ================= -->
  <g id="realistic-tooth">
    <!-- Anatomical Tooth Body (Crown + Dual Roots) -->
    <path d="M52 68 C44 40, 68 28, 100 32 C132 28, 156 40, 148 68 C142 94, 150 134, 138 160 C130 176, 118 154, 110 130 C104 112, 96 112, 90 130 C82 154, 70 176, 62 160 C50 134, 58 94, 52 68 Z"
          fill="url(#enamelGrad)"/>

    <!-- Enamel Crest Highlight & Cusps Contour -->
    <path d="M60 48 C80 36, 120 36, 140 48" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M96 34 L100 70 M84 46 Q100 58 116 46" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Left Crown Specular Glare -->
    <ellipse cx="70" cy="62" rx="8" ry="16" fill="#FFFFFF" opacity="0.75" transform="rotate(-15 70 62)"/>
    <circle cx="82" cy="54" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- ================= Fresh Foaming Toothbrush Scrubbing the Tooth ================= -->
  <g id="toothbrush-action" transform="translate(110, 48) rotate(35)">
    <!-- Brush Handle -->
    <rect x="-8" y="22" width="16" height="78" rx="8" fill="#3B82F6"/>
    <rect x="-5" y="24" width="10" height="74" rx="5" fill="#60A5FA"/>
    <!-- Brush Head Backing -->
    <rect x="-10" y="0" width="20" height="24" rx="5" fill="#1D4ED8"/>

    <!-- Multi-Tuft Bristles -->
    <rect x="-8" y="-12" width="16" height="13" fill="url(#bristlesGrad)" rx="2"/>
    <line x1="-5" y1="-12" x2="-5" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-12" x2="0" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="-12" x2="5" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Fresh Toothpaste Foam Bubbles -->
  <g id="clean-bubbles">
    <circle cx="112" cy="56" r="10" fill="#E0F2FE" opacity="0.85" stroke="#BAE6FD" stroke-width="1.5"/>
    <circle cx="110" cy="54" r="3" fill="#FFFFFF"/>
    <circle cx="126" cy="68" r="7" fill="#E0F2FE" opacity="0.85" stroke="#BAE6FD" stroke-width="1.5"/>
    <circle cx="98" cy="46" r="6" fill="#E0F2FE" opacity="0.9" stroke="#BAE6FD" stroke-width="1"/>

    <!-- Sparkling Diamond Clean Glints -->
    <g transform="translate(136, 32) scale(0.65)">
      <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="#38BDF8"/>
      <circle cx="12" cy="12" r="2.5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(42, 60) scale(0.5)">
      <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="#38BDF8"/>
      <circle cx="12" cy="12" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
