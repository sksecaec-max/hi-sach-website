<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowFoot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="legSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="sockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sneakerRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="108" cy="180" rx="76" ry="14" fill="url(#shadowFoot)"/>

  <!-- Ankle / Lower Leg -->
  <rect x="62" y="25" width="46" height="65" rx="10" fill="url(#legSkin)"/>

  <!-- White Sock with Cyan Stripe -->
  <rect x="58" y="72" width="54" height="32" rx="6" fill="url(#sockGrad)"/>
  <rect x="58" y="80" width="54" height="6" fill="#0284C7"/>

  <!-- Sneaker Main Body -->
  <path d="M48 102 C48 95, 114 95, 114 102 L128 120 C145 124, 172 135, 174 152 C174 162, 160 166, 142 166 L42 166 C32 166, 32 145, 34 125 Z"
        fill="url(#sneakerRed)"/>

  <!-- Toe Cap (White Rubber) -->
  <path d="M142 138 C158 140, 174 146, 174 158 C174 164, 155 166, 142 166 Z" fill="#F8FAFC"/>

  <!-- Shoe Laces & Eyelets -->
  <ellipse cx="98" cy="116" rx="3.5" ry="3" fill="#FFFFFF"/>
  <ellipse cx="114" cy="122" rx="3.5" ry="3" fill="#FFFFFF"/>
  <ellipse cx="130" cy="130" rx="3.5" ry="3" fill="#FFFFFF"/>
  <path d="M96 116 L118 126 M112 122 L134 133" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sneaker Swoosh / Lightning Side Stripe -->
  <path d="M54 138 Q90 128 126 148" stroke="#FDE047" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Outsole (Thick 3D Platform) -->
  <path d="M30 162 L174 162 C178 162, 180 168, 175 174 L165 178 L32 178 C26 178, 25 162, 30 162 Z" fill="url(#soleGrad)"/>
  <!-- Sole Tread Grooves -->
  <line x1="50" y1="174" x2="56" y2="178" stroke="#64748B" stroke-width="2"/>
  <line x1="80" y1="174" x2="86" y2="178" stroke="#64748B" stroke-width="2"/>
  <line x1="110" y1="174" x2="116" y2="178" stroke="#64748B" stroke-width="2"/>
  <line x1="140" y1="174" x2="146" y2="178" stroke="#64748B" stroke-width="2"/>
</svg>
