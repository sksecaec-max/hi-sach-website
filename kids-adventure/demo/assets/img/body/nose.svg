<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowNose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="noseTip" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="45%" stop-color="#FFB74D"/>
      <stop offset="80%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#FFB74D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="175" rx="55" ry="14" fill="url(#shadowNose)"/>

  <!-- Nasal Bridge -->
  <path d="M92 40 L108 40 L115 110 L85 110 Z" fill="url(#bridgeGrad)"/>

  <!-- Left Nostril Flange (Ala) -->
  <ellipse cx="74" cy="128" rx="16" ry="14" fill="url(#noseTip)"/>
  <!-- Right Nostril Flange (Ala) -->
  <ellipse cx="126" cy="128" rx="16" ry="14" fill="url(#noseTip)"/>

  <!-- Nostril Holes -->
  <ellipse cx="82" cy="136" rx="6" ry="4" fill="#BF360C"/>
  <ellipse cx="118" cy="136" rx="6" ry="4" fill="#BF360C"/>

  <!-- Center Nose Tip Bulb -->
  <circle cx="100" cy="120" r="26" fill="url(#noseTip)"/>

  <!-- Glossy Tip Highlight -->
  <ellipse cx="96" cy="112" rx="9" ry="6" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="104" cy="116" r="3" fill="#FFFFFF" opacity="0.4"/>
</svg>
