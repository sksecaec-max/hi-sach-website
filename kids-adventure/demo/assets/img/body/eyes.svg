<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowEyes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scleraGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="85%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </radialGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="browGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1500"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="75" ry="14" fill="url(#shadowEyes)"/>

  <!-- Eyebrows -->
  <path d="M32 58 Q60 44 88 56" stroke="url(#browGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M112 56 Q140 44 168 58" stroke="url(#browGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Left Eye Outer Contour -->
  <g id="left-eye">
    <ellipse cx="60" cy="100" rx="34" ry="24" fill="url(#lidGrad)"/>
    <!-- Sclera (White) -->
    <ellipse cx="60" cy="100" rx="30" ry="20" fill="url(#scleraGrad)"/>
    <!-- Iris -->
    <circle cx="60" cy="100" r="14" fill="url(#irisGrad)"/>
    <!-- Pupil -->
    <circle cx="60" cy="100" r="7.5" fill="#0F172A"/>
    <!-- Glossy Highlights -->
    <circle cx="56" cy="95" r="4" fill="#FFFFFF"/>
    <circle cx="64" cy="104" r="2" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Right Eye Outer Contour -->
  <g id="right-eye">
    <ellipse cx="140" cy="100" rx="34" ry="24" fill="url(#lidGrad)"/>
    <!-- Sclera (White) -->
    <ellipse cx="140" cy="100" rx="30" ry="20" fill="url(#scleraGrad)"/>
    <!-- Iris -->
    <circle cx="140" cy="100" r="14" fill="url(#irisGrad)"/>
    <!-- Pupil -->
    <circle cx="140" cy="100" r="7.5" fill="#0F172A"/>
    <!-- Glossy Highlights -->
    <circle cx="136" cy="95" r="4" fill="#FFFFFF"/>
    <circle cx="144" cy="104" r="2" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Eyelashes / Creases -->
  <path d="M30 96 Q60 74 90 96" stroke="#4E342E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M110 96 Q140 74 170 96" stroke="#4E342E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
