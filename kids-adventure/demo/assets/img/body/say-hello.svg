<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Table / Ambient Shadow -->
    <radialGradient id="helloGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#1E293B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Glowing Greeting Aura -->
    <radialGradient id="greetingAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FEF08A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Realistic Skin Tone Volumetric Gradient for Palm -->
    <radialGradient id="skinPalmHello" cx="44%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#FFF0E3"/>
      <stop offset="35%" stop-color="#FCD5B5"/>
      <stop offset="70%" stop-color="#F4B78F"/>
      <stop offset="90%" stop-color="#E19468"/>
      <stop offset="100%" stop-color="#C27346"/>
    </radialGradient>

    <!-- Finger 3D Cylindrical Volume Gradient -->
    <linearGradient id="skinFingerHello" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE1CA"/>
      <stop offset="30%" stop-color="#FFF4EB"/>
      <stop offset="70%" stop-color="#F5BA93"/>
      <stop offset="100%" stop-color="#D47F52"/>
    </linearGradient>

    <!-- Thumb 3D Gradient -->
    <linearGradient id="skinThumbHello" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EB"/>
      <stop offset="45%" stop-color="#FCD2B0"/>
      <stop offset="80%" stop-color="#EAA376"/>
      <stop offset="100%" stop-color="#CA7849"/>
    </linearGradient>

    <!-- Natural Fingernail Shimmer -->
    <linearGradient id="nailGradHello" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFEBE5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8C7BD" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Golden Foil Stars -->
    <linearGradient id="starGoldHello" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Ambient Golden Aura -->
  <circle cx="100" cy="100" r="85" fill="url(#greetingAura)"/>

  <!-- Ground Drop Shadow -->
  <ellipse cx="100" cy="178" rx="65" ry="14" fill="url(#helloGroundShadow)"/>

  <!-- ================= Playful Greeting Motion Trails ================= -->
  <path d="M152 42 C168 56, 172 80, 165 100" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.7"/>
  <path d="M162 52 C178 68, 180 92, 174 110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating Cheerful Greeting Stars -->
  <g transform="translate(166, 38)">
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="url(#starGoldHello)"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
  <g transform="translate(36, 68)">
    <path d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z" fill="url(#starGoldHello)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
  <circle cx="174" cy="74" r="2.5" fill="#FDE047" opacity="0.8"/>
  <circle cx="28" cy="102" r="2" fill="#38BDF8" opacity="0.7"/>

  <!-- ================= Realistic Friendly Waving Hand ================= -->
  <g id="say-hello-hand" transform="translate(100, 102) rotate(-8) translate(-100, -102)">

    <!-- Wrist Base entering with soft sleeve trim -->
    <path d="M78 152 C78 166, 80 178, 82 182 C91 184, 109 184, 118 182 C120 178, 122 166, 122 152 Z" fill="url(#skinPalmHello)"/>
    <!-- Sleeve Cuff (Sporty Teal/Cyan) -->
    <path d="M76 174 C76 170, 124 170, 124 174 L122 183 C122 185, 78 185, 78 183 Z" fill="#0284C7"/>
    <rect x="76" y="172" width="48" height="3" rx="1.5" fill="#38BDF8"/>

    <!-- ================= Fingers ================= -->
    <!-- Pinky Finger -->
    <g id="hello-pinky">
      <path d="M128 102 C130 84, 132 68, 131 55 C130 47, 119 47, 118 55 C116 68, 115 84, 115 102 Z"
            fill="url(#skinFingerHello)"/>
      <path d="M119 70 Q124 72 129 70" fill="none" stroke="#C27346" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
      <path d="M119 86 Q124 88 129 86" fill="none" stroke="#C27346" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
      <path d="M120 51 C120 47, 129 47, 129 51 C129 55, 120 55, 120 51 Z" fill="url(#nailGradHello)"/>
    </g>

    <!-- Ring Finger -->
    <g id="hello-ring">
      <path d="M114 92 C115 74, 116 50, 115 36 C114 26, 102 26, 101 36 C100 50, 100 74, 100 93 Z"
            fill="url(#skinFingerHello)"/>
      <path d="M102 54 Q108 56 113 54" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M102 73 Q108 75 113 73" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M103 31 C103 27, 113 27, 113 31 C113 35, 103 35, 103 31 Z" fill="url(#nailGradHello)"/>
    </g>

    <!-- Middle Finger (Tallest) -->
    <g id="hello-middle">
      <path d="M99 88 C100 68, 100 42, 99 26 C98 16, 85 16, 84 26 C83 42, 84 68, 84 88 Z"
            fill="url(#skinFingerHello)"/>
      <path d="M86 46 Q92 48 97 46" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M86 67 Q92 69 97 67" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M87 21 C87 17, 97 17, 97 21 C97 25, 87 25, 87 21 Z" fill="url(#nailGradHello)"/>
    </g>

    <!-- Index Finger -->
    <g id="hello-index">
      <path d="M83 92 C83 73, 82 51, 81 37 C80 27, 68 27, 67 37 C66 51, 66 74, 66 95 Z"
            fill="url(#skinFingerHello)"/>
      <path d="M69 56 Q75 58 80 56" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M69 75 Q75 77 80 75" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M70 32 C70 28, 79 28, 79 32 C79 36, 70 36, 70 32 Z" fill="url(#nailGradHello)"/>
    </g>

    <!-- ================= Volumetric Palm ================= -->
    <path d="M65 95 C65 89, 130 89, 130 104 C132 124, 129 146, 122 156 C112 163, 86 163, 76 156 C68 142, 52 126, 54 114 C56 103, 63 98, 65 95 Z"
          fill="url(#skinPalmHello)"/>

    <!-- Soft Fleshy Cushion Highlights -->
    <ellipse cx="73" cy="135" rx="12" ry="16" fill="#FFF4EB" opacity="0.45" transform="rotate(-25 73 135)"/>
    <ellipse cx="116" cy="132" rx="9" ry="14" fill="#FFF4EB" opacity="0.35"/>

    <!-- Natural Palm Creases -->
    <path d="M76 108 C87 111, 108 110, 123 113" fill="none" stroke="#C27346" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M71 117 C85 120, 105 124, 118 128" fill="none" stroke="#C27346" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M69 112 C79 120, 87 136, 83 150" fill="none" stroke="#C27346" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

    <!-- ================= Thumb ================= -->
    <g id="hello-thumb">
      <path d="M70 122 C65 114, 55 105, 46 96 C38 88, 28 97, 35 106 C42 116, 51 130, 60 142 C66 147, 74 138, 70 122 Z"
            fill="url(#skinThumbHello)"/>
      <path d="M41 104 Q46 109 50 106" fill="none" stroke="#C27346" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
      <path d="M33 95 C32 91, 41 90, 43 93 C45 96, 36 100, 33 95 Z" fill="url(#nailGradHello)"/>
    </g>

    <!-- Subtle Edge Highlights -->
    <path d="M68 36 C68 29, 79 29, 79 36 L79 78" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
    <path d="M85 25 C85 18, 96 18, 96 25 L96 73" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
