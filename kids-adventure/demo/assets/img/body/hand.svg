<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Ground Shadow -->
    <radialGradient id="handDropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#1E293B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Realistic Skin Tone Volumetric Gradient for Palm -->
    <radialGradient id="skinPalm" cx="44%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#FFE8D6"/>
      <stop offset="35%" stop-color="#FCD5B5"/>
      <stop offset="70%" stop-color="#F4B78F"/>
      <stop offset="90%" stop-color="#E19468"/>
      <stop offset="100%" stop-color="#C27346"/>
    </radialGradient>

    <!-- Finger 3D Cylindrical Volume Gradient -->
    <linearGradient id="skinFinger" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE1CA"/>
      <stop offset="30%" stop-color="#FFEEDF"/>
      <stop offset="70%" stop-color="#F5BA93"/>
      <stop offset="100%" stop-color="#D47F52"/>
    </linearGradient>

    <!-- Thumb 3D Gradient -->
    <linearGradient id="skinThumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEEDF"/>
      <stop offset="45%" stop-color="#FCD2B0"/>
      <stop offset="80%" stop-color="#EAA376"/>
      <stop offset="100%" stop-color="#CA7849"/>
    </linearGradient>

    <!-- Natural Fingernail Shimmer -->
    <linearGradient id="nailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFEBE5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8C7BD" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Golden Wave Motion Sparks -->
    <radialGradient id="sparkGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="110" cy="198" rx="68" ry="14" fill="url(#handDropShadow)"/>

  <!-- ================= Waving Gesture Accents (Say Hello!) ================= -->
  <!-- Playful Waving Motion Wind Arcs -->
  <path d="M165 42 C180 56, 185 82, 178 104" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.6"/>
  <path d="M176 54 C192 70, 195 96, 188 116" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Cheerful Hello Sparkles -->
  <g transform="translate(182, 40)">
    <!-- 4-point golden greeting star -->
    <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(42, 60)">
    <path d="M0 -7 L1.5 -1.5 L7 0 L1.5 1.5 L0 7 L-1.5 1.5 L-7 0 L-1.5 -1.5 Z" fill="#FACC15" opacity="0.85"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
  </g>
  <circle cx="192" cy="78" r="2" fill="#FDE047" opacity="0.75"/>

  <!-- ================= Main Hand Anatomy ================= -->
  <!-- Hand Group tilted slightly in a warm friendly waving angle -->
  <g id="realistic-hand" transform="translate(110, 110) rotate(-6) translate(-110, -110)">

    <!-- Wrist Base -->
    <path d="M84 160 C84 175, 86 190, 88 195 C98 197, 122 197, 132 195 C134 190, 136 175, 136 160 Z" fill="url(#skinPalm)"/>
    <path d="M88 195 C98 197, 122 197, 132 195" stroke="#C27346" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- ================= Fingers ================= -->
    <!-- Little Finger (Pinky) -->
    <g id="finger-pinky">
      <path d="M141 106 C143 85, 145 68, 144 54 C143 45, 131 45, 130 54 C128 68, 127 86, 127 106 Z"
            fill="url(#skinFinger)"/>
      <!-- Pinky Joint Creases -->
      <path d="M131 72 Q137 74 142 72" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
      <path d="M131 89 Q137 91 142 89" fill="none" stroke="#C27346" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
      <!-- Fingernail -->
      <path d="M132 50 C132 46, 142 46, 142 50 C142 54, 132 54, 132 50 Z" fill="url(#nailGrad)"/>
    </g>

    <!-- Ring Finger -->
    <g id="finger-ring">
      <path d="M126 95 C127 75, 128 50, 127 34 C126 23, 113 23, 112 34 C111 50, 111 75, 111 96 Z"
            fill="url(#skinFinger)"/>
      <!-- Ring Finger Knuckle Creases -->
      <path d="M113 54 Q119 56 125 54" fill="none" stroke="#C27346" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <path d="M113 74 Q119 76 125 74" fill="none" stroke="#C27346" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <!-- Fingernail -->
      <path d="M114 29 C114 24, 125 24, 125 29 C125 34, 114 34, 114 29 Z" fill="url(#nailGrad)"/>
    </g>

    <!-- Middle Finger (Tallest) -->
    <g id="finger-middle">
      <path d="M109 90 C110 68, 110 40, 109 23 C108 12, 94 12, 93 23 C92 40, 93 68, 93 90 Z"
            fill="url(#skinFinger)"/>
      <!-- Middle Finger Knuckle Creases -->
      <path d="M95 46 Q101 48 107 46" fill="none" stroke="#C27346" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <path d="M95 68 Q101 70 107 68" fill="none" stroke="#C27346" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <!-- Fingernail -->
      <path d="M96 18 C96 13, 107 13, 107 18 C107 23, 96 23, 96 18 Z" fill="url(#nailGrad)"/>
    </g>

    <!-- Index Finger -->
    <g id="finger-index">
      <path d="M92 95 C92 74, 91 50, 90 35 C89 24, 76 24, 75 35 C74 50, 74 75, 74 98 Z"
            fill="url(#skinFinger)"/>
      <!-- Index Finger Knuckle Creases -->
      <path d="M76 56 Q83 58 89 56" fill="none" stroke="#C27346" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <path d="M76 76 Q83 78 89 76" fill="none" stroke="#C27346" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <!-- Fingernail -->
      <path d="M77 30 C77 25, 88 25, 88 30 C88 35, 77 35, 77 30 Z" fill="url(#nailGrad)"/>
    </g>

    <!-- ================= Palm Body ================= -->
    <!-- Volumetric palm with natural contour around thumb base and finger roots -->
    <path d="M73 98 C73 92, 143 92, 143 108 C145 130, 142 154, 134 165 C124 172, 94 172, 84 165 C76 150, 58 132, 60 120 C62 108, 70 102, 73 98 Z"
          fill="url(#skinPalm)"/>

    <!-- Thenar Eminence (Thumb Muscle Pad) Soft Highlight -->
    <ellipse cx="80" cy="142" rx="14" ry="18" fill="#FFEFE3" opacity="0.45" transform="rotate(-25 80 142)"/>
    <!-- Hypothenar Eminence (Pinky Side Cushion) Soft Highlight -->
    <ellipse cx="128" cy="138" rx="10" ry="16" fill="#FFEFE3" opacity="0.35"/>

    <!-- Natural Palm Creases (Life line, Head line, Heart line) -->
    <!-- Heart Line (Upper transverse crease) -->
    <path d="M84 112 C96 116, 120 114, 136 118" fill="none" stroke="#C27346" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <!-- Head Line (Middle transverse crease) -->
    <path d="M78 122 C94 126, 116 130, 130 134" fill="none" stroke="#C27346" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <!-- Life Line (Thenar curve around thumb) -->
    <path d="M76 116 C88 124, 96 142, 92 158" fill="none" stroke="#C27346" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- ================= Thumb ================= -->
    <g id="finger-thumb">
      <!-- Natural articulated thumb extending smoothly outward at 35 degrees -->
      <path d="M78 126 C72 118, 62 108, 52 98 C43 89, 32 99, 40 109 C48 120, 58 136, 68 148 C74 154, 82 144, 78 126 Z"
            fill="url(#skinThumb)"/>
      <!-- Thumb Knuckle Crease -->
      <path d="M46 106 Q52 112 56 108" fill="none" stroke="#C27346" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
      <!-- Thumb Fingernail -->
      <path d="M38 97 C37 93, 46 91, 49 95 C51 98, 41 102, 38 97 Z" fill="url(#nailGrad)"/>
    </g>

    <!-- Gentle Ambient Edge Specular Glow -->
    <path d="M76 34 C76 26, 88 26, 88 34 L88 80" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M94 22 C94 14, 106 14, 106 22 L106 75" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
