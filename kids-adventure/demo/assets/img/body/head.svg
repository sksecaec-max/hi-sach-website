<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowHead" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="42%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#FFCC80"/>
      <stop offset="85%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </radialGradient>
    <linearGradient id="hairGradHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="45%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#1A0C08"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="182" rx="65" ry="13" fill="url(#shadowHead)"/>

  <!-- Neck -->
  <rect x="85" y="140" width="30" height="35" rx="8" fill="#F57C00"/>

  <!-- Ears -->
  <ellipse cx="44" cy="105" rx="12" ry="16" fill="#FFB74D"/>
  <ellipse cx="45" cy="105" rx="6" ry="10" fill="#F57C00"/>
  <ellipse cx="156" cy="105" rx="12" ry="16" fill="#FFB74D"/>
  <ellipse cx="155" cy="105" rx="6" ry="10" fill="#F57C00"/>

  <!-- Head / Face -->
  <circle cx="100" cy="100" r="58" fill="url(#faceGrad)"/>

  <!-- 3D Hair -->
  <path d="M42 90 C42 35, 158 35, 158 90 C140 70, 115 62, 92 68 C72 68, 55 78, 42 90 Z" fill="url(#hairGradHead)"/>
  <path d="M48 76 C72 54, 128 54, 152 76 C138 62, 96 60, 68 66 Z" fill="#8D6E63" opacity="0.65"/>

  <!-- Eyebrows -->
  <path d="M72 84 Q82 78 92 84" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M108 84 Q118 78 128 84" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Sparkling Eyes -->
  <ellipse cx="82" cy="96" rx="8" ry="10" fill="#FFFFFF"/>
  <circle cx="83" cy="96" r="5" fill="#3E2723"/>
  <circle cx="85" cy="94" r="2" fill="#FFFFFF"/>

  <ellipse cx="118" cy="96" rx="8" ry="10" fill="#FFFFFF"/>
  <circle cx="117" cy="96" r="5" fill="#3E2723"/>
  <circle cx="119" cy="94" r="2" fill="#FFFFFF"/>

  <!-- Cute Nose -->
  <path d="M100 100 C96 110, 92 112, 100 114 C104 114, 104 110, 100 100 Z" fill="#F57C00"/>

  <!-- Smiling Mouth -->
  <path d="M85 125 Q100 142 115 125" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="68" cy="114" rx="9" ry="5.5" fill="#FF8A80" opacity="0.5"/>
  <ellipse cx="132" cy="114" rx="9" ry="5.5" fill="#FF8A80" opacity="0.5"/>
</svg>
