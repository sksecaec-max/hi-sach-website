<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Ground Shadow -->
    <radialGradient id="myBodyFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Glowing Background Aura -->
    <radialGradient id="myBodyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#BAE6FD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Realistic Skin Tone - Face Volumetric -->
    <radialGradient id="skinFaceCard" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF3EB"/>
      <stop offset="35%" stop-color="#FED7BA"/>
      <stop offset="70%" stop-color="#F9B890"/>
      <stop offset="92%" stop-color="#E2946A"/>
      <stop offset="100%" stop-color="#C27346"/>
    </radialGradient>

    <linearGradient id="skinLimbCard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEADB"/>
      <stop offset="40%" stop-color="#FED7BA"/>
      <stop offset="85%" stop-color="#EAA37A"/>
      <stop offset="100%" stop-color="#CE7D50"/>
    </linearGradient>

    <!-- Hair Gradients -->
    <linearGradient id="hairBaseCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="45%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1810"/>
    </linearGradient>
    <linearGradient id="hairHighlightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="50%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>

    <!-- Shirt 3D Cobalt Gradient -->
    <linearGradient id="shirtGradCard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#0284C7"/>
      <stop offset="75%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Shorts Indigo Gradient -->
    <linearGradient id="shortsGradCard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Sneaker Red Gradient -->
    <linearGradient id="sneakerRedCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="85%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Iris Gradient -->
    <radialGradient id="irisGradCard" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="90%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1B0000"/>
    </radialGradient>
  </defs>

  <!-- Ambient Blue Glow -->
  <circle cx="120" cy="118" r="95" fill="url(#myBodyAura)"/>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="224" rx="68" ry="11" fill="url(#myBodyFloorShadow)"/>

  <!-- Character Scaled and Centered for Card (viewBox 240x240, scaled ~0.48, centered) -->
  <g transform="translate(120, 116) scale(0.48) translate(-150, -235)">
    <!-- ================= ARMS & HANDS ================= -->
    <g id="card-leftarm">
      <path d="M96 182 C74 205, 62 232, 58 266" fill="none" stroke="url(#skinLimbCard)" stroke-width="20" stroke-linecap="round"/>
      <g transform="translate(56, 274) rotate(15)">
        <ellipse cx="0" cy="8" rx="10" ry="11" fill="url(#skinFaceCard)"/>
        <path d="M-6 4 C-11 2, -13 8, -9 12 C-7 14, -4 10, -3 8 Z" fill="url(#skinLimbCard)"/>
        <rect x="-8" y="16" width="4.5" height="11" rx="2.2" fill="url(#skinLimbCard)"/>
        <rect x="-3" y="17" width="4.5" height="13" rx="2.2" fill="url(#skinLimbCard)"/>
        <rect x="2" y="17" width="4.5" height="12" rx="2.2" fill="url(#skinLimbCard)"/>
        <rect x="7" y="16" width="4" height="9.5" rx="2" fill="url(#skinLimbCard)"/>
      </g>
    </g>

    <g id="card-rightarm">
      <path d="M204 182 C226 205, 238 232, 242 266" fill="none" stroke="url(#skinLimbCard)" stroke-width="20" stroke-linecap="round"/>
      <g transform="translate(244, 274) rotate(-15)">
        <ellipse cx="0" cy="8" rx="10" ry="11" fill="url(#skinFaceCard)"/>
        <path d="M6 4 C11 2, 13 8, 9 12 C7 14, 4 10, 3 8 Z" fill="url(#skinLimbCard)"/>
        <rect x="-11" y="16" width="4" height="9.5" rx="2" fill="url(#skinLimbCard)"/>
        <rect x="-6.5" y="17" width="4.5" height="12" rx="2.2" fill="url(#skinLimbCard)"/>
        <rect x="-1.5" y="17" width="4.5" height="13" rx="2.2" fill="url(#skinLimbCard)"/>
        <rect x="3.5" y="16" width="4.5" height="11" rx="2.2" fill="url(#skinLimbCard)"/>
      </g>
    </g>

    <!-- ================= LEGS & SNEAKERS ================= -->
    <g id="card-leftleg">
      <path d="M112 308 C110 338, 110 380, 114 425" fill="none" stroke="url(#skinLimbCard)" stroke-width="25" stroke-linecap="round"/>
      <ellipse cx="111" cy="358" rx="10" ry="6" fill="#FFF3EB" opacity="0.4"/>
      <path d="M99 416 C99 412, 127 412, 127 416 L127 428 L99 428 Z" fill="#F8FAFC"/>
      <line x1="99" y1="418" x2="127" y2="418" stroke="#EF4444" stroke-width="1.8"/>
      <!-- Sneaker -->
      <g transform="translate(76, 424)">
        <path d="M8 22 C14 21, 52 21, 56 22 C58 28, 54 34, 48 34 L12 34 C6 34, 4 28, 8 22 Z" fill="#FFFFFF"/>
        <path d="M6 32 L56 32" stroke="#CBD5E1" stroke-width="1.5"/>
        <path d="M12 22 C10 14, 22 8, 36 8 C46 8, 50 14, 52 22 Z" fill="url(#sneakerRedCard)"/>
        <path d="M8 22 C10 16, 20 13, 26 15 C24 20, 20 23, 14 23 Z" fill="#FFFFFF"/>
        <circle cx="34" cy="12" r="1.5" fill="#FFFFFF"/>
        <circle cx="40" cy="14" r="1.5" fill="#FFFFFF"/>
        <path d="M32 14 L42 12" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <g id="card-rightleg">
      <path d="M188 308 C190 338, 190 380, 186 425" fill="none" stroke="url(#skinLimbCard)" stroke-width="25" stroke-linecap="round"/>
      <ellipse cx="189" cy="358" rx="10" ry="6" fill="#FFF3EB" opacity="0.4"/>
      <path d="M173 416 C173 412, 201 412, 201 416 L201 428 L173 428 Z" fill="#F8FAFC"/>
      <line x1="173" y1="418" x2="201" y2="418" stroke="#EF4444" stroke-width="1.8"/>
      <!-- Sneaker -->
      <g transform="translate(166, 424)">
        <path d="M2 22 C6 21, 44 21, 50 22 C54 28, 52 34, 46 34 L10 34 C4 34, 0 28, 2 22 Z" fill="#FFFFFF"/>
        <path d="M2 32 L52 32" stroke="#CBD5E1" stroke-width="1.5"/>
        <path d="M6 22 C8 14, 12 8, 22 8 C36 8, 48 14, 46 22 Z" fill="url(#sneakerRedCard)"/>
        <path d="M32 15 C38 13, 48 16, 50 22 C44 23, 40 20, 38 15 Z" fill="#FFFFFF"/>
        <circle cx="18" cy="14" r="1.5" fill="#FFFFFF"/>
        <circle cx="24" cy="12" r="1.5" fill="#FFFFFF"/>
        <path d="M16 12 L26 14" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ================= SHORTS ================= -->
    <g id="card-shorts">
      <ellipse cx="150" cy="320" rx="54" ry="10" fill="#0F172A" opacity="0.3"/>
      <path d="M96 252 L204 252 C208 280, 210 305, 210 320 C200 322, 168 322, 160 320 L150 285 L140 320 C132 322, 100 322, 90 320 C90 305, 92 280, 96 252 Z"
            fill="url(#shortsGradCard)"/>
      <path d="M96 252 L204 252 L202 264 L98 264 Z" fill="#312E81"/>
      <path d="M104 266 C108 280, 116 288, 128 290" fill="none" stroke="#FDE047" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8"/>
      <path d="M196 266 C192 280, 184 288, 172 290" fill="none" stroke="#FDE047" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8"/>
    </g>

    <!-- ================= TORSO & CREW-NECK TEE ================= -->
    <g id="card-torso">
      <path d="M92 172 C92 166, 122 164, 150 164 C178 164, 208 166, 208 172 C206 200, 204 235, 203 260 C170 262, 130 262, 97 260 C96 235, 94 200, 92 172 Z"
            fill="url(#shirtGradCard)"/>
      <!-- Sleeves -->
      <path d="M92 172 C80 178, 68 194, 66 210 C76 215, 94 216, 100 204 L96 174 Z" fill="#0284C7"/>
      <path d="M208 172 C220 178, 232 194, 234 210 C224 215, 206 216, 200 204 L204 174 Z" fill="#0369A1"/>
      <!-- Collar -->
      <path d="M124 164 C124 176, 176 176, 176 164 C170 171, 130 171, 124 164 Z" fill="#0369A1"/>
      <path d="M125 164 C125 174, 175 174, 175 164" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <!-- Chest Lightning -->
      <path d="M152 192 L142 208 L150 208 L146 226 L160 206 L151 206 Z" fill="#FACC15"/>
    </g>

    <!-- ================= NECK ================= -->
    <path d="M136 142 C136 156, 164 156, 164 142 L164 168 C155 170, 145 170, 136 168 Z" fill="url(#skinLimbCard)"/>

    <!-- ================= HEAD & FACE ================= -->
    <g id="card-head">
      <path d="M96 95 C90 40, 210 40, 204 95 C206 125, 200 135, 194 140 C180 150, 120 150, 106 140 C100 135, 94 125, 96 95 Z" fill="url(#hairBaseCard)"/>

      <!-- Ears -->
      <g transform="translate(93, 102)">
        <ellipse cx="0" cy="0" rx="9" ry="13" fill="url(#skinFaceCard)"/>
        <path d="M1 -7 C-3 -3, -3 3, 1 7" fill="none" stroke="#C27346" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(207, 102)">
        <ellipse cx="0" cy="0" rx="9" ry="13" fill="url(#skinFaceCard)"/>
        <path d="M-1 -7 C3 -3, 3 3, -1 7" fill="none" stroke="#C27346" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- 3D Volumetric Face -->
      <path d="M102 96 C100 60, 200 60, 198 96 C198 128, 186 150, 150 152 C114 150, 102 128, 102 96 Z"
            fill="url(#skinFaceCard)"/>

      <!-- Cheeks -->
      <ellipse cx="120" cy="116" rx="12" ry="7" fill="#FF8A80" opacity="0.4"/>
      <ellipse cx="180" cy="116" rx="12" ry="7" fill="#FF8A80" opacity="0.4"/>

      <!-- Front Hair Layers -->
      <path d="M96 85 C92 48, 140 32, 168 34 C198 36, 212 55, 206 85 C198 68, 180 58, 160 58 C135 58, 110 68, 96 85 Z"
            fill="url(#hairBaseCard)"/>
      <path d="M98 78 C115 62, 138 60, 150 72 C162 62, 186 64, 202 82 C190 76, 175 74, 164 80 C154 86, 142 84, 134 78 C124 72, 110 76, 98 78 Z"
            fill="url(#hairHighlightCard)"/>
      <path d="M120 46 C138 38, 168 40, 184 48" fill="none" stroke="#BCAAA4" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

      <!-- Eyes -->
      <g transform="translate(128, 98)">
        <ellipse cx="0" cy="0" rx="10" ry="11" fill="#FFFFFF"/>
        <path d="M-10 -3 C-8 -8, 8 -8, 10 -3 C8 -5, -8 -5, -10 -3 Z" fill="#94A3B8" opacity="0.3"/>
        <circle cx="0.5" cy="0" r="7.5" fill="url(#irisGradCard)"/>
        <circle cx="0.5" cy="0" r="4.2" fill="#0F172A"/>
        <circle cx="-2" cy="-2.5" r="2.2" fill="#FFFFFF"/>
        <circle cx="2.5" cy="2" r="1.1" fill="#FFFFFF"/>
        <path d="M-11 -1 C-6 -10, 6 -10, 11 -1" fill="none" stroke="#2D1810" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(172, 98)">
        <ellipse cx="0" cy="0" rx="10" ry="11" fill="#FFFFFF"/>
        <path d="M-10 -3 C-8 -8, 8 -8, 10 -3 C8 -5, -8 -5, -10 -3 Z" fill="#94A3B8" opacity="0.3"/>
        <circle cx="-0.5" cy="0" r="7.5" fill="url(#irisGradCard)"/>
        <circle cx="-0.5" cy="0" r="4.2" fill="#0F172A"/>
        <circle cx="-3" cy="-2.5" r="2.2" fill="#FFFFFF"/>
        <circle cx="1.5" cy="2" r="1.1" fill="#FFFFFF"/>
        <path d="M-11 -1 C-6 -10, 6 -10, 11 -1" fill="none" stroke="#2D1810" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Eyebrows -->
      <path d="M117 82 C124 76, 134 77, 140 82" fill="none" stroke="#4E342E" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M160 82 C166 76, 176 77, 183 82" fill="none" stroke="#4E342E" stroke-width="3.2" stroke-linecap="round"/>

      <!-- Nose -->
      <g transform="translate(150, 108)">
        <path d="M0 -6 C-2 -2, -6 2, -5 6 C-3 8, 3 8, 5 6 C6 2, 2 -2, 0 -6 Z" fill="#E2946A"/>
        <ellipse cx="0" cy="5" rx="3.5" ry="2.2" fill="#FFF3EB" opacity="0.6"/>
      </g>

      <!-- Smile -->
      <g transform="translate(150, 126)">
        <path d="M-16 -2 Q0 18 16 -2 Q0 24 -16 -2 Z" fill="#991B1B"/>
        <path d="M-13 0 Q0 6 13 0 Q0 1 -13 0 Z" fill="#FFFFFF"/>
        <path d="M-8 10 Q0 6 8 10 Q0 17 -8 10 Z" fill="#F87171"/>
        <path d="M-17 -3 Q0 1 17 -3" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M-18 -5 C-19 -3, -19 0, -17 2" fill="none" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M18 -5 C19 -3, 19 0, 17 2" fill="none" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
