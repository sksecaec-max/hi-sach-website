<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Tabletop Ground Shadow -->
    <radialGradient id="deskShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>

    <!-- Brass / Golden Metal Rim Gradients -->
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#CA8A04"/>
      <stop offset="75%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Wood Handle Gradient -->
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="35%" stop-color="#78350F"/>
      <stop offset="70%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Block A Red Gradients -->
    <linearGradient id="redBlockFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="redBlockTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="redBlockSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Block B Blue Gradients -->
    <linearGradient id="blueBlockFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="blueBlockTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="blueBlockSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Block C Gold Gradients -->
    <linearGradient id="goldBlockFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldBlockTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Realistic Glass Lens Glare -->
    <radialGradient id="lensGlare" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#E0F2FE" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="100" cy="176" rx="80" ry="16" fill="url(#deskShadow)"/>

  <!-- ================= 3D Wooden Alphabet Blocks ================= -->

  <!-- Block B (Blue, Sitting slightly behind to the right) -->
  <g id="block-B" transform="translate(110, 88)">
    <!-- Top Face -->
    <polygon points="0,-18 32,-30 64,-18 32,-6" fill="url(#blueBlockTop)"/>
    <!-- Left/Front Face -->
    <polygon points="0,-18 32,-6 32,32 0,20" fill="url(#blueBlockFront)"/>
    <!-- Right/Side Face -->
    <polygon points="32,-6 64,-18 64,20 32,32" fill="url(#blueBlockSide)"/>
    <!-- Carved Letter 'B' -->
    <text x="16" y="14" font-family="'Fredoka', 'Baloo 2', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" transform="skewY(-16)">B</text>
  </g>

  <!-- Block C (Amber Yellow, in the background) -->
  <g id="block-C" transform="translate(68, 64)">
    <polygon points="0,-14 26,-24 52,-14 26,-4" fill="url(#goldBlockTop)"/>
    <polygon points="0,-14 26,-4 26,24 0,14" fill="url(#goldBlockFront)"/>
    <polygon points="26,-4 52,-14 52,14 26,24" fill="#B45309"/>
    <text x="13" y="10" font-family="'Fredoka', 'Baloo 2', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" transform="skewY(-16)">C</text>
  </g>

  <!-- Block A (Red, Front and Center) -->
  <g id="block-A" transform="translate(34, 102)">
    <!-- Top Face -->
    <polygon points="0,-22 36,-36 72,-22 36,-8" fill="url(#redBlockTop)"/>
    <!-- Front Face -->
    <polygon points="0,-22 36,-8 36,36 0,22" fill="url(#redBlockFront)"/>
    <!-- Side Face -->
    <polygon points="36,-8 72,-22 72,22 36,36" fill="url(#redBlockSide)"/>
    <!-- Subtle Edge Highlight -->
    <line x1="36" y1="-8" x2="36" y2="36" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
    <!-- Carved Bold Letter 'A' -->
    <text x="18" y="15" font-family="'Fredoka', 'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" transform="skewY(-18)">A</text>
  </g>

  <!-- ================= Realistic Detective Magnifying Glass ================= -->
  <g id="magnifying-glass" transform="translate(104, 94) rotate(-32)">
    <!-- Cast Shadow of Magnifier -->
    <ellipse cx="6" cy="18" rx="46" ry="12" fill="#0F172A" opacity="0.25"/>

    <!-- Handle Neck Fitting -->
    <rect x="-6" y="44" width="12" height="10" rx="2" fill="url(#brassGold)"/>
    <rect x="-8" y="47" width="16" height="4" rx="1.5" fill="#78350F"/>

    <!-- Turned Wood Handle -->
    <path d="M-6 54 C-9 72, -10 95, -7 114 C-4 122, 4 122, 7 114 C10 95, 9 72, 6 54 Z" fill="url(#woodHandle)"/>
    <!-- Handle Brass Pommel Tip -->
    <ellipse cx="0" cy="116" rx="7" ry="4" fill="url(#brassGold)"/>
    <circle cx="0" cy="118" r="3" fill="#CA8A04"/>

    <!-- Brass Outer Frame Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#brassGold)" stroke-width="8"/>
    <!-- Inner Dark Bezel Rim -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#713F12" stroke-width="1.5"/>

    <!-- Glass Lens Surface with High Transparency -->
    <circle cx="0" cy="0" r="43.5" fill="url(#lensGlare)"/>

    <!-- Magnified Golden Letter 'A' seen through lens -->
    <g transform="translate(-2, 2) scale(1.15)">
      <text x="0" y="4" font-family="'Fredoka', 'Baloo 2', sans-serif" font-weight="900" font-size="34" fill="#DC2626" text-anchor="middle" dominant-baseline="central">A</text>
      <!-- Sparkle on magnified letter -->
      <polygon points="12,-10 14,-6 18,-4 14,-2 12,2 10,-2 6,-4 10,-6" fill="#FDE047"/>
    </g>

    <!-- Curved Specular Light Reflection Glare across Glass -->
    <path d="M-30 -22 C-15 -38, 15 -38, 30 -22" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
    <circle cx="-28" cy="-8" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="32" cy="16" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
