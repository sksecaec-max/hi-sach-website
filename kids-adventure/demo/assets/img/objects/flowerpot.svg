<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowPot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="45%" stop-color="#EA580C"/>
      <stop offset="85%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="leafGradPot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="flowerPink" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="182" rx="65" ry="12" fill="url(#shadowPot)"/>

  <!-- Plant Leaves Behind -->
  <path d="M100 95 Q65 60 50 35 Q85 45 100 95 Z" fill="url(#leafGradPot)"/>
  <path d="M100 95 Q135 60 150 35 Q115 45 100 95 Z" fill="url(#leafGradPot)"/>
  <path d="M100 95 Q80 50 82 25 Q105 45 100 95 Z" fill="url(#leafGradPot)"/>
  <path d="M100 95 Q120 50 118 25 Q95 45 100 95 Z" fill="url(#leafGradPot)"/>

  <!-- Blooming Flowers -->
  <!-- Left Blossom -->
  <g transform="translate(68, 48)">
    <circle cx="0" cy="-10" r="7" fill="url(#flowerPink)"/>
    <circle cx="10" cy="-3" r="7" fill="url(#flowerPink)"/>
    <circle cx="6" cy="9" r="7" fill="url(#flowerPink)"/>
    <circle cx="-6" cy="9" r="7" fill="url(#flowerPink)"/>
    <circle cx="-10" cy="-3" r="7" fill="url(#flowerPink)"/>
    <circle cx="0" cy="0" r="5" fill="#FACC15"/>
  </g>
  <!-- Right Blossom -->
  <g transform="translate(132, 48)">
    <circle cx="0" cy="-10" r="7" fill="url(#flowerPink)"/>
    <circle cx="10" cy="-3" r="7" fill="url(#flowerPink)"/>
    <circle cx="6" cy="9" r="7" fill="url(#flowerPink)"/>
    <circle cx="-6" cy="9" r="7" fill="url(#flowerPink)"/>
    <circle cx="-10" cy="-3" r="7" fill="url(#flowerPink)"/>
    <circle cx="0" cy="0" r="5" fill="#FACC15"/>
  </g>

  <!-- Rich Soil Mound -->
  <ellipse cx="100" cy="104" rx="46" ry="12" fill="#3E2723"/>

  <!-- Terracotta Pot Rim Collar -->
  <path d="M50 96 L150 96 C155 96, 155 112, 150 112 L50 112 C45 112, 45 96, 50 96 Z" fill="url(#terracotta)"/>
  <ellipse cx="100" cy="96" rx="50" ry="8" fill="#F97316"/>
  <ellipse cx="100" cy="96" rx="46" ry="6" fill="#3E2723"/>

  <!-- Terracotta Tapered Base Body -->
  <path d="M55 112 L68 170 C69 174, 131 174, 132 170 L145 112 Z" fill="url(#terracotta)"/>

  <!-- Pot 3D Curved Light Reflection -->
  <path d="M68 116 L76 166" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.35"/>
</svg>
