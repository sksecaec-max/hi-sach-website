<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Ground Shadow -->
    <radialGradient id="plantGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Golden Sunshine Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FBBF24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Terracotta Pot 3D Volume Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="65%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <!-- Rich Fertile Soil Gradient -->
    <radialGradient id="soilGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5B3A29"/>
      <stop offset="60%" stop-color="#382318"/>
      <stop offset="100%" stop-color="#1F130B"/>
    </radialGradient>

    <!-- Sunflower Outer Petal Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Sunflower Seed Disc Texture -->
    <radialGradient id="sunflowerDisc" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="45%" stop-color="#451A03"/>
      <stop offset="85%" stop-color="#271002"/>
      <stop offset="100%" stop-color="#0F0500"/>
    </radialGradient>

    <!-- Stem & Leaves Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Glossy Watering Can Blue Gradient -->
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Sparkling Water Droplets -->
    <radialGradient id="waterDrop" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="100" cy="184" rx="76" ry="14" fill="url(#plantGroundShadow)"/>

  <!-- ================= WARM RADIANT SUN (Top Right) ================= -->
  <g id="radiant-sun" transform="translate(166, 36)">
    <!-- Sun Ambient Glow Halo -->
    <circle cx="0" cy="0" r="32" fill="url(#sunGlow)"/>
    <!-- Solar Beams -->
    <g stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-22" x2="0" y2="-17"/>
      <line x1="15" y1="-15" x2="12" y2="-12"/>
      <line x1="22" y1="0" x2="17" y2="0"/>
      <line x1="15" y1="15" x2="12" y2="12"/>
      <line x1="0" y1="22" x2="0" y2="17"/>
      <line x1="-15" y1="15" x2="-12" y2="12"/>
      <line x1="-22" y1="0" x2="-17" y2="0"/>
      <line x1="-15" y1="-15" x2="-12" y2="-12"/>
    </g>
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="14" fill="#FACC15"/>
    <circle cx="-3" cy="-3" r="4" fill="#FFFBEB" opacity="0.75"/>
  </g>

  <!-- ================= TERRACOTTA FLOWER POT ================= -->
  <g id="flower-pot" transform="translate(100, 142)">
    <!-- Pot Body Base -->
    <path d="M-34 0 L34 0 L26 38 C25 41, 22 42, 18 42 L-18 42 C-22 42, -25 41, -26 38 Z" fill="url(#potGrad)"/>
    <!-- Pot Rim -->
    <rect x="-38" y="-6" width="76" height="12" rx="4" fill="url(#potGrad)"/>
    <rect x="-38" y="-6" width="76" height="2" rx="1" fill="#FED7AA" opacity="0.6"/>

    <!-- Dark Fertile Potting Soil -->
    <ellipse cx="0" cy="-4" rx="34" ry="7" fill="url(#soilGrad)"/>
    <!-- Earth Granules -->
    <circle cx="-16" cy="-4" r="1.5" fill="#78350F"/>
    <circle cx="12" cy="-3" r="1.8" fill="#78350F"/>
    <circle cx="-4" cy="-5" r="1.2" fill="#9A3412"/>
    <circle cx="22" cy="-4" r="1.2" fill="#9A3412"/>
  </g>

  <!-- ================= BLOOMING SUNFLOWER & LEAVES ================= -->
  <!-- Main Stem -->
  <path d="M100 138 C100 110, 106 90, 104 62" fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Left Broad Leaf with Dewdrop -->
  <g transform="translate(102, 114)">
    <path d="M0 0 C-18 -2, -34 10, -42 6 C-40 -8, -22 -14, 0 -6 Z" fill="url(#stemGrad)"/>
    <path d="M0 -3 C-16 -3, -32 4, -40 6" fill="none" stroke="#86EFAC" stroke-width="1.2"/>
    <!-- Dewdrop -->
    <ellipse cx="-24" cy="-3" rx="2.5" ry="3.2" fill="url(#waterDrop)"/>
    <circle cx="-24.8" cy="-4" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Right Broad Leaf -->
  <g transform="translate(103, 94)">
    <path d="M0 0 C18 -2, 34 8, 40 4 C38 -8, 20 -14, 0 -5 Z" fill="url(#stemGrad)"/>
    <path d="M0 -3 C16 -3, 30 3, 38 4" fill="none" stroke="#86EFAC" stroke-width="1.2"/>
  </g>

  <!-- Sunflower Head Group (Positioned at 104, 52) -->
  <g id="sunflower-bloom" transform="translate(104, 52)">
    <!-- Back Row of Golden Petals (Rotated around 360 deg) -->
    <g fill="url(#petalGrad)">
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(0)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(30)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(60)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(90)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(120)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(150)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(180)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(210)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(240)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(270)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(300)"/>
      <path d="M0 -14 C-5 -24, -3 -38, 0 -44 C3 -38, 5 -24, 0 -14 Z" transform="rotate(330)"/>
    </g>

    <!-- Front Row of Golden Petals (Offset by 15 deg) -->
    <g fill="url(#petalGrad)">
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(15)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(45)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(75)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(105)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(135)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(165)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(195)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(225)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(255)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(285)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(315)"/>
      <path d="M0 -12 C-4 -20, -3 -32, 0 -38 C3 -32, 4 -20, 0 -12 Z" transform="rotate(345)"/>
    </g>

    <!-- Center Seed Disc with Rich Warm Depth -->
    <circle cx="0" cy="0" r="16" fill="url(#sunflowerDisc)"/>
    <!-- Disc Ring Texture Dots -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.75"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="1.5 2" opacity="0.8"/>
    <!-- Cheerful Golden Sparkle on Bloom -->
    <polygon points="6,-6 8,-3 12,-1 8,1 6,5 4,1 0,-1 4,-3" fill="#FFFFFF"/>
  </g>

  <!-- ================= CUTE WATERING CAN (Pouring on the Left) ================= -->
  <g id="watering-can" transform="translate(42, 88) rotate(22)">
    <!-- Can Body -->
    <path d="M-14 6 C-14 -12, 14 -12, 14 6 C14 18, 10 22, -14 22 Z" fill="url(#canBody)"/>
    <!-- Top Opening -->
    <ellipse cx="0" cy="-6" rx="10" ry="3" fill="#0369A1"/>
    <!-- Arching Handle -->
    <path d="M-12 14 C-26 10, -26 -14, -6 -12" fill="none" stroke="url(#canBody)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Long Spout -->
    <path d="M12 4 L28 -14" fill="none" stroke="url(#canBody)" stroke-width="5" stroke-linecap="round"/>
    <!-- Rose Head Sprinkler Tip -->
    <ellipse cx="30" cy="-16" rx="4" ry="7" fill="#38BDF8" transform="rotate(-30 30 -16)"/>
    <!-- Glossy Highlight on Can -->
    <path d="M-8 0 C-4 -8, 6 -8, 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Sparkling Crystalline Water Droplets Stream -->
  <g id="water-stream">
    <circle cx="68" cy="116" r="2.5" fill="url(#waterDrop)"/>
    <circle cx="74" cy="126" r="3" fill="url(#waterDrop)"/>
    <circle cx="82" cy="132" r="2.2" fill="url(#waterDrop)"/>
    <circle cx="76" cy="140" r="3.2" fill="url(#waterDrop)"/>
    <circle cx="85" cy="144" r="2" fill="url(#waterDrop)"/>
    <!-- Droplet Glints -->
    <circle cx="73" cy="124.5" r="1" fill="#FFFFFF"/>
    <circle cx="75" cy="138.5" r="1" fill="#FFFFFF"/>
  </g>

  <!-- ================= PLAYFUL FLUTTERING BUTTERFLY ================= -->
  <g id="butterfly" transform="translate(142, 92) rotate(-15) scale(0.9)">
    <!-- Left Wings -->
    <path d="M0 0 C-8 -12, -18 -8, -14 2 C-10 6, -4 4, 0 0 Z" fill="#F43F5E"/>
    <path d="M0 2 C-8 6, -14 14, -8 18 C-4 18, -2 8, 0 2 Z" fill="#FB923C"/>
    <!-- Right Wings -->
    <path d="M0 0 C8 -12, 18 -8, 14 2 C10 6, 4 4, 0 0 Z" fill="#F43F5E"/>
    <path d="M0 2 C8 6, 14 14, 8 18 C4 18, 2 8, 0 2 Z" fill="#FB923C"/>
    <!-- Slender Body -->
    <ellipse cx="0" cy="4" rx="1.8" ry="8" fill="#1E293B"/>
    <!-- Antennae -->
    <path d="M-1 -4 Q-4 -8 -6 -8" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    <path d="M1 -4 Q4 -8 6 -8" fill="none" stroke="#1E293B" stroke-width="0.8"/>
  </g>
</svg>
