<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="yoyo-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B120C" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#1B120C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1B120C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yoyo-outer" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="35%" stop-color="#F44336"/>
      <stop offset="75%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>
    <radialGradient id="yoyo-inner" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="40%" stop-color="#FBC02D"/>
      <stop offset="85%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <linearGradient id="yoyo-spec" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="180" rx="55" ry="14" fill="url(#yoyo-shadow)"/>

  <!-- Yo-yo String winding up -->
  <path d="M100 100 C100 70 85 45 92 20 C95 12 108 12 110 20 C110 32 98 42 100 55" fill="none" stroke="#ECEFF1" stroke-width="3" stroke-linecap="round"/>

  <!-- Back Half of Yo-yo (giving deep 3D bevel) -->
  <ellipse cx="106" cy="104" rx="52" ry="52" fill="#880E4F"/>

  <!-- Central Axle -->
  <circle cx="100" cy="100" r="14" fill="#B0BEC5"/>

  <!-- Front Half of Yo-yo -->
  <ellipse cx="96" cy="98" rx="52" ry="52" fill="url(#yoyo-outer)"/>

  <!-- Concentric Inner Ring -->
  <circle cx="96" cy="98" r="34" fill="url(#yoyo-inner)"/>

  <!-- Central Hub / Emblem -->
  <circle cx="96" cy="98" r="18" fill="url(#yoyo-outer)"/>
  <!-- Star emblem in center -->
  <polygon points="96,86 100,94 108,95 102,100 104,108 96,103 88,108 90,100 84,95 92,94" fill="#FFEB3B"/>

  <!-- Specular highlights on outer dome -->
  <ellipse cx="80" cy="74" rx="22" ry="11" transform="rotate(-30 80 74)" fill="url(#yoyo-spec)"/>
</svg>
