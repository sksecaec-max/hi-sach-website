<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowTam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="podGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="35%" stop-color="#B45309"/>
      <stop offset="70%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="72" ry="13" fill="url(#shadowTam)"/>

  <!-- Stem & Feathery Leaves -->
  <g id="foliage">
    <path d="M40 70 Q70 50 100 62" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Leaflets -->
    <ellipse cx="50" cy="54" rx="8" ry="4" transform="rotate(-30 50 54)" fill="url(#leafGrad)"/>
    <ellipse cx="65" cy="50" rx="8" ry="4" transform="rotate(-20 65 50)" fill="url(#leafGrad)"/>
    <ellipse cx="80" cy="50" rx="8" ry="4" transform="rotate(10 80 50)" fill="url(#leafGrad)"/>
    <ellipse cx="95" cy="54" rx="8" ry="4" transform="rotate(30 95 54)" fill="url(#leafGrad)"/>
    <ellipse cx="58" cy="68" rx="8" ry="4" transform="rotate(40 58 68)" fill="url(#leafGrad)"/>
    <ellipse cx="74" cy="68" rx="8" ry="4" transform="rotate(30 74 68)" fill="url(#leafGrad)"/>
  </g>

  <!-- Main Curved Tamarind Pod with Lobes -->
  <!-- Lobe 1 (Head) -->
  <circle cx="58" cy="100" r="24" fill="url(#podGrad)"/>
  <!-- Lobe 2 (Mid-Left) -->
  <circle cx="86" cy="118" r="26" fill="url(#podGrad)"/>
  <!-- Lobe 3 (Mid-Right) -->
  <circle cx="120" cy="126" r="25" fill="url(#podGrad)"/>
  <!-- Lobe 4 (Tail) -->
  <circle cx="150" cy="116" r="20" fill="url(#podGrad)"/>
  <!-- Tip -->
  <path d="M150 116 L168 110 L156 126 Z" fill="#78350F"/>

  <!-- Connecting Smooth Hull Body -->
  <path d="M42 90 C70 105, 120 110, 166 110 C155 145, 95 152, 45 120 Z" fill="url(#podGrad)"/>

  <!-- Pod Seam Ridge -->
  <path d="M42 96 Q90 120 162 114" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Specular Highlights on Lobes -->
  <ellipse cx="54" cy="94" rx="8" ry="5" transform="rotate(-20 54 94)" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="84" cy="110" rx="9" ry="5.5" transform="rotate(-15 84 110)" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="118" cy="118" rx="8" ry="5" transform="rotate(10 118 118)" fill="#FFFFFF" opacity="0.35"/>
</svg>
