<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowLotus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="padGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <linearGradient id="petalPink" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F472B6"/>
      <stop offset="85%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="petalCenter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <radialGradient id="waterDrop" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
  </defs>

  <!-- Floating Lily Pad -->
  <ellipse cx="100" cy="165" rx="88" ry="24" fill="url(#padGrad)"/>
  <!-- Lily Pad Veins & Notch -->
  <path d="M100 165 L188 165" stroke="#064E3B" stroke-width="2.5"/>
  <path d="M100 165 L45 152 M100 165 L60 178 M100 165 L145 152 M100 165 L135 178" stroke="#10B981" stroke-width="2" opacity="0.6"/>
  <!-- Water Droplets on Pad -->
  <circle cx="140" cy="168" r="4.5" fill="url(#waterDrop)"/>
  <circle cx="138" cy="166" r="1.5" fill="#FFFFFF"/>
  <circle cx="65" cy="162" r="3" fill="url(#waterDrop)"/>

  <!-- Ground / Water Ripple Shadow -->
  <ellipse cx="100" cy="160" rx="60" ry="12" fill="url(#shadowLotus)"/>

  <!-- Lotus Outer Petals -->
  <path d="M35 140 C35 110, 65 95, 100 135 C65 145, 45 148, 35 140 Z" fill="url(#petalPink)"/>
  <path d="M165 140 C165 110, 135 95, 100 135 C135 145, 155 148, 165 140 Z" fill="url(#petalPink)"/>

  <!-- Mid Petals Layer -->
  <path d="M50 120 C50 80, 85 70, 100 125 C80 135, 60 132, 50 120 Z" fill="url(#petalPink)"/>
  <path d="M150 120 C150 80, 115 70, 100 125 C120 135, 140 132, 150 120 Z" fill="url(#petalPink)"/>

  <!-- Inner Upper Blooming Petals -->
  <path d="M70 100 C70 55, 95 45, 100 115 C90 122, 78 116, 70 100 Z" fill="url(#petalCenter)"/>
  <path d="M130 100 C130 55, 105 45, 100 115 C110 122, 122 116, 130 100 Z" fill="url(#petalCenter)"/>

  <!-- Central Crown Petal -->
  <path d="M100 35 C115 65, 115 110, 100 128 C85 110, 85 65, 100 35 Z" fill="url(#petalCenter)"/>

  <!-- Golden Stamen Radiance -->
  <circle cx="100" cy="115" r="9" fill="#FACC15"/>
  <circle cx="100" cy="115" r="5" fill="#EAB308"/>
  <circle cx="98" cy="113" r="2" fill="#FFFFFF"/>
</svg>
