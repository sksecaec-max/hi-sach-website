<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="jug-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B120C" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#1B120C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1B120C" stop-opacity="0"/>
    </radialGradient>
    <!-- Juice inside gradient -->
    <linearGradient id="juice-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="35%" stop-color="#FFA000"/>
      <stop offset="70%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <!-- Glass Jug body gradient -->
    <linearGradient id="glass-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B2EBF2" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#E0F7FA" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#80DEEA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4DD0E1" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Specular streak -->
    <linearGradient id="specular-jug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="lemon-slice" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="80%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="180" rx="55" ry="14" fill="url(#jug-shadow)"/>

  <!-- Handle -->
  <path d="M136 68 C178 72 176 138 132 144" fill="none" stroke="#80DEEA" stroke-width="12" stroke-linecap="round"/>
  <path d="M136 68 C178 72 176 138 132 144" fill="none" stroke="#E0F7FA" stroke-width="5" stroke-linecap="round"/>

  <!-- Jug Main Body Back -->
  <path d="M72 48 L60 48 Q50 48 50 62 Q45 105 52 145 Q56 168 98 168 Q140 168 144 145 Q150 105 142 62 Q142 48 130 48 Z" fill="url(#glass-body)"/>

  <!-- Golden Juice Liquid inside -->
  <path d="M54 90 C70 95 125 85 142 90 Q146 125 141 144 Q136 164 98 164 Q59 164 54 144 Q50 125 54 90 Z" fill="url(#juice-grad)" opacity="0.9"/>
  <!-- Juice liquid surface meniscus -->
  <ellipse cx="98" cy="90" rx="44" ry="9" fill="#FFE082"/>

  <!-- Floating Lemon slice in juice -->
  <g transform="translate(90, 115) rotate(-25)">
    <circle cx="0" cy="0" r="14" fill="url(#lemon-slice)"/>
    <circle cx="0" cy="0" r="10" fill="#FFF59D"/>
    <!-- Segments -->
    <path d="M-8 0 L8 0 M0 -8 L0 8" stroke="#F57F17" stroke-width="1.2"/>
  </g>

  <!-- Ice cubes floating -->
  <rect x="70" y="96" width="16" height="15" rx="3" fill="#FFFFFF" opacity="0.6" transform="rotate(15 70 96)"/>
  <rect x="110" y="105" width="15" height="14" rx="3" fill="#FFFFFF" opacity="0.6" transform="rotate(-12 110 105)"/>

  <!-- Glass reflection and gloss on front -->
  <path d="M72 48 L60 48 Q50 48 50 62 Q45 105 52 145 Q56 168 98 168 Q140 168 144 145 Q150 105 142 62 Q142 48 130 48 Z" fill="none" stroke="#B2EBF2" stroke-width="3"/>

  <!-- Spout -->
  <path d="M60 48 L46 44 Q42 46 48 52 L54 58 Z" fill="#80DEEA"/>
  <path d="M60 48 L46 44 Q42 46 48 52 L54 58 Z" fill="#E0F7FA" opacity="0.6"/>

  <!-- Rim of jug -->
  <ellipse cx="96" cy="48" rx="36" ry="7" fill="none" stroke="#E0F7FA" stroke-width="3"/>

  <!-- Strong 3D Specular Highlight stripe on left contour -->
  <path d="M62 65 Q56 110 65 152" stroke="url(#specular-jug)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <ellipse cx="90" cy="58" rx="14" ry="3" fill="#FFFFFF" opacity="0.75"/>
</svg>
