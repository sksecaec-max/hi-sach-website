<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Water Ripple Shadow -->
    <radialGradient id="fishWaterShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Realistic Fish Body 3D Volume Gradient -->
    <radialGradient id="clownfishBody" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF9E57"/>
      <stop offset="25%" stop-color="#FF7A00"/>
      <stop offset="65%" stop-color="#E65100"/>
      <stop offset="90%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#7A1D05"/>
    </radialGradient>

    <!-- Translucent Fin Gradient with Rays -->
    <linearGradient id="finShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FB923C" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#EA580C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Translucent Bubble Gradient -->
    <radialGradient id="waterBubble" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#BAE6FD" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Ground / Water Ripple Shadow -->
  <ellipse cx="98" cy="176" rx="68" ry="12" fill="url(#fishWaterShadow)"/>

  <!-- Water Air Bubbles with Realistic Spherical Highlights -->
  <g id="bubbles">
    <circle cx="28" cy="62" r="6" fill="url(#waterBubble)"/>
    <ellipse cx="26" cy="59" rx="2" ry="1" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="20" cy="44" r="9" fill="url(#waterBubble)"/>
    <ellipse cx="17" cy="40" rx="3.5" ry="1.8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="34" cy="32" r="4.5" fill="url(#waterBubble)"/>
    <ellipse cx="32" cy="30" rx="1.5" ry="0.8" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- ================= Realistic Tropical Clownfish ================= -->

  <!-- Caudal / Tail Fin -->
  <path d="M142 98 Q182 60 176 98 Q182 136 142 98 Z" fill="url(#finShade)"/>
  <path d="M174 76 Q178 98 174 120" stroke="#0F172A" stroke-width="2.5" fill="none" opacity="0.8"/>
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.4" stroke-linecap="round">
    <line x1="144" y1="98" x2="172" y2="78"/>
    <line x1="144" y1="98" x2="175" y2="88"/>
    <line x1="144" y1="98" x2="176" y2="98"/>
    <line x1="144" y1="98" x2="175" y2="108"/>
    <line x1="144" y1="98" x2="172" y2="118"/>
  </g>

  <!-- Dorsal Fin (Top Spine) -->
  <path d="M72 70 Q95 38 126 66 Q134 72 136 78 Z" fill="url(#finShade)"/>
  <path d="M74 68 Q96 38 128 66" stroke="#0F172A" stroke-width="2.5" fill="none"/>
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.35">
    <line x1="84" y1="62" x2="94" y2="46"/>
    <line x1="98" y1="64" x2="106" y2="48"/>
    <line x1="112" y1="66" x2="118" y2="54"/>
  </g>

  <!-- Pelvic & Anal Fins (Bottom) -->
  <path d="M84 126 Q98 152 114 126 Z" fill="url(#finShade)"/>
  <path d="M86 128 Q98 152 112 128" stroke="#0F172A" stroke-width="2" fill="none"/>
  <path d="M122 118 Q134 140 144 116 Z" fill="url(#finShade)"/>

  <!-- Main Realistic Torso (Curved Hydrodynamic Fish Body) -->
  <path d="M38 98 C38 64, 144 64, 144 98 C144 132, 38 132, 38 98 Z" fill="url(#clownfishBody)"/>

  <!-- ================= Realistic Curved White Stripes with Black Rims ================= -->
  <!-- Head Stripe -->
  <path d="M68 68 C76 84, 76 112, 68 128 C76 127, 80 116, 80 98 C80 80, 76 69, 68 68 Z"
        fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Mid-Body Stripe with Characteristic Center Forward Bulge -->
  <path d="M106 72 C114 84, 114 112, 106 124 C116 122, 122 112, 120 98 C122 84, 116 74, 106 72 Z"
        fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Tail Peduncle Stripe -->
  <path d="M138 86 Q142 98 138 110 Q144 106 144 98 Q144 90 138 86 Z"
        fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Pectoral Fin (Waving Side Fin with Translucent Rays) -->
  <g transform="translate(74, 94)">
    <path d="M0 6 Q20 28 32 14 Q22 0 0 6 Z" fill="url(#finShade)"/>
    <path d="M22 24 Q32 14 26 4" stroke="#0F172A" stroke-width="2" fill="none"/>
    <line x1="4" y1="6" x2="28" y2="14" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="6" y1="8" x2="24" y2="20" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- Realistic Biological Eye (Amber Iris, Black Pupil, Specular White Glint) -->
  <circle cx="56" cy="92" r="9.5" fill="#E2E8F0"/>
  <circle cx="56" cy="92" r="8.5" fill="#F59E0B"/>
  <circle cx="56" cy="92" r="5" fill="#0F172A"/>
  <circle cx="54" cy="90" r="2.2" fill="#FFFFFF"/>
  <circle cx="58" cy="94" r="1" fill="#FFFFFF" opacity="0.7"/>

  <!-- Realistic Fish Mouth & Gill Operculum Line -->
  <path d="M38 98 Q44 102 48 99" stroke="#7A1D05" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M62 82 Q65 98 62 114" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Specular Wet Skin Highlights -->
  <path d="M52 74 Q90 66 128 76" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>
  <circle cx="48" cy="80" r="2.5" fill="#FFFFFF" opacity="0.6"/>
</svg>
