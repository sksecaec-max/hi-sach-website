<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowGlasses" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="lensGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#E0F2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="172" rx="75" ry="12" fill="url(#shadowGlasses)"/>

  <!-- Left Temple Arm (Extending Back) -->
  <path d="M40 98 L18 80 C15 76, 12 80, 15 84 L36 102 Z" fill="#0284C7"/>
  <!-- Right Temple Arm (Extending Back) -->
  <path d="M160 98 L182 80 C185 76, 188 80, 185 84 L164 102 Z" fill="#0284C7"/>

  <!-- Center Bridge -->
  <path d="M85 106 Q100 96 115 106" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Left Lens & Frame -->
  <g id="left-glass">
    <!-- Outer Rim -->
    <rect x="32" y="78" width="56" height="52" rx="18" fill="url(#frameGrad)"/>
    <!-- Glass Lens -->
    <rect x="38" y="84" width="44" height="40" rx="14" fill="url(#lensGrad)"/>
    <!-- Glare Reflection Slant Lines -->
    <line x1="48" y1="88" x2="62" y2="120" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="58" y1="88" x2="72" y2="120" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Right Lens & Frame -->
  <g id="right-glass">
    <!-- Outer Rim -->
    <rect x="112" y="78" width="56" height="52" rx="18" fill="url(#frameGrad)"/>
    <!-- Glass Lens -->
    <rect x="118" y="84" width="44" height="40" rx="14" fill="url(#lensGrad)"/>
    <!-- Glare Reflection Slant Lines -->
    <line x1="128" y1="88" x2="142" y2="120" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="138" y1="88" x2="152" y2="120" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Frame 3D Edge Highlights -->
  <path d="M34 82 C50 74, 76 74, 86 82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M114 82 C130 74, 156 74, 166 82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
