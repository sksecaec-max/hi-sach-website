<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Kido original: a slice of pizza (What's That Animal? silly decoy — "pizza") -->
  <defs>
    <radialGradient id="pz-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B120C" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#1B120C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1B120C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pz-crust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4C27A"/>
      <stop offset="60%" stop-color="#D98E3C"/>
      <stop offset="100%" stop-color="#A65E1E"/>
    </linearGradient>
    <linearGradient id="pz-cheese" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE98A"/>
      <stop offset="60%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#F0A21E"/>
    </linearGradient>
    <radialGradient id="pz-pep" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FF7B6B"/>
      <stop offset="60%" stop-color="#D93A2B"/>
      <stop offset="100%" stop-color="#8E1D14"/>
    </radialGradient>
    <linearGradient id="pz-spec" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="182" rx="40" ry="9" fill="url(#pz-shadow)"/>

  <!-- Slice: crust along the top, point at the bottom -->
  <path d="M28 46 Q100 16 172 46 L104 176 Q100 182 96 176 Z" fill="url(#pz-cheese)"/>
  <!-- Melted cheese drip -->
  <path d="M70 120 Q74 136 78 128 Q80 120 82 112 Z" fill="#FFC93C"/>
  <!-- Crust -->
  <path d="M24 44 Q100 12 176 44 Q178 58 166 60 Q100 34 34 60 Q22 58 24 44 Z" fill="url(#pz-crust)"/>
  <path d="M40 46 Q100 24 160 46" fill="none" stroke="#FFE2B0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Pepperoni -->
  <circle cx="78" cy="80" r="14" fill="url(#pz-pep)"/>
  <circle cx="124" cy="78" r="13" fill="url(#pz-pep)"/>
  <circle cx="102" cy="118" r="12" fill="url(#pz-pep)"/>
  <circle cx="96" cy="152" r="7" fill="url(#pz-pep)"/>
  <!-- Herbs -->
  <path d="M60 96 l6 -4" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 100 l-6 -5" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
  <path d="M116 140 l5 3" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>

  <!-- Gloss -->
  <ellipse cx="74" cy="76" rx="5" ry="2.6" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="120" cy="74" rx="5" ry="2.6" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="96" cy="96" rx="16" ry="5" transform="rotate(-15 96 96)" fill="url(#pz-spec)"/>
</svg>
