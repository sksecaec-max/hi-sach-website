<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Sky & Meadow Gradients -->
    <linearGradient id="houseSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="meadowGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Warm Red Brick Wall Gradient -->
    <linearGradient id="brickWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="25%" stop-color="#EF4444"/>
      <stop offset="65%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Terracotta Shingle Roof Gradient -->
    <linearGradient id="roofShingles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="85%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <!-- Warm Oak Wood Door -->
    <linearGradient id="woodDoor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="35%" stop-color="#B45309"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Glowing Sunlit Window Glass -->
    <radialGradient id="windowGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Soft House Shadow -->
    <radialGradient id="houseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="100" cy="182" rx="78" ry="14" fill="url(#houseShadow)"/>

  <!-- Scenic Sky Backdrop Container -->
  <rect x="12" y="16" width="176" height="168" rx="20" fill="url(#houseSky)"/>

  <!-- Fluffy White Clouds -->
  <g fill="#FFFFFF" opacity="0.88">
    <circle cx="44" cy="38" r="10"/>
    <circle cx="56" cy="34" r="13"/>
    <circle cx="68" cy="38" r="9"/>
    <rect x="40" y="38" width="30" height="10" rx="4"/>
  </g>

  <!-- Distant Golden Sun -->
  <circle cx="166" cy="36" r="16" fill="#FDE047" opacity="0.85"/>
  <circle cx="166" cy="36" r="26" fill="#FDE047" opacity="0.2"/>

  <!-- Lush Grassy Lawn & Hill -->
  <path d="M12 136 C60 128, 140 128, 188 136 L188 184 L12 184 Z" fill="url(#meadowGrass)"/>

  <!-- Cobblestone Front Path -->
  <path d="M90 178 L110 178 L104 154 L96 154 Z" fill="#94A3B8"/>
  <ellipse cx="98" cy="162" rx="3" ry="1.5" fill="#CBD5E1"/>
  <ellipse cx="102" cy="170" rx="3.5" ry="1.8" fill="#CBD5E1"/>

  <!-- ================= DREAM COTTAGE / HOUSE ================= -->
  <!-- Stone Foundation Base -->
  <rect x="46" y="148" width="108" height="8" rx="2" fill="#64748B"/>
  <line x1="46" y1="152" x2="154" y2="152" stroke="#475569" stroke-width="1"/>

  <!-- Warm Red Brick Main Walls -->
  <g id="house-walls">
    <rect x="50" y="94" width="100" height="54" rx="2" fill="url(#brickWall)"/>
    <!-- Realistic Brick Mortar Courses -->
    <g stroke="#991B1B" stroke-width="1" opacity="0.6">
      <line x1="50" y1="104" x2="150" y2="104"/>
      <line x1="50" y1="114" x2="150" y2="114"/>
      <line x1="50" y1="124" x2="150" y2="124"/>
      <line x1="50" y1="134" x2="150" y2="134"/>
      <line x1="50" y1="144" x2="150" y2="144"/>
      <!-- Staggered vertical brick joints -->
      <line x1="62" y1="94" x2="62" y2="104"/>
      <line x1="84" y1="94" x2="84" y2="104"/>
      <line x1="116" y1="94" x2="116" y2="104"/>
      <line x1="138" y1="94" x2="138" y2="104"/>
      <line x1="72" y1="104" x2="72" y2="114"/>
      <line x1="126" y1="104" x2="126" y2="114"/>
      <line x1="62" y1="114" x2="62" y2="124"/>
      <line x1="138" y1="114" x2="138" y2="124"/>
      <line x1="72" y1="124" x2="72" y2="134"/>
      <line x1="126" y1="124" x2="126" y2="134"/>
    </g>
  </g>

  <!-- ================= CHIMNEY & PUFFS OF SMOKE ================= -->
  <!-- Brick Chimney -->
  <rect x="122" y="44" width="16" height="28" fill="#B91C1C"/>
  <rect x="120" y="42" width="20" height="4" rx="1.5" fill="#7F1D1D"/>

  <!-- Friendly Puffs of White Chimney Smoke -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="130" cy="34" r="5"/>
    <circle cx="134" cy="24" r="7"/>
    <circle cx="139" cy="14" r="9"/>
    <circle cx="146" cy="6" r="11" opacity="0.6"/>
  </g>

  <!-- ================= TERRACOTTA SHINGLE ROOF ================= -->
  <g id="house-roof">
    <!-- Main Triangular Pitched Gable Roof -->
    <polygon points="100,42 38,98 162,98" fill="url(#roofShingles)"/>
    <!-- 3D Overhang Eaves Trim -->
    <polygon points="100,42 36,99 40,102 100,48" fill="#FDBA74" opacity="0.6"/>
    <polygon points="100,42 164,99 160,102 100,48" fill="#7C2D12" opacity="0.7"/>
    <rect x="36" y="96" width="128" height="5" rx="2" fill="#9A3412"/>

    <!-- Shingle Texture Lines -->
    <path d="M54 84 Q100 78 146 84" fill="none" stroke="#7C2D12" stroke-width="1.8"/>
    <path d="M68 70 Q100 66 132 70" fill="none" stroke="#7C2D12" stroke-width="1.8"/>
    <path d="M82 56 Q100 53 118 56" fill="none" stroke="#7C2D12" stroke-width="1.8"/>

    <!-- Little Attic Window in Gable -->
    <circle cx="100" cy="74" r="9" fill="#1E293B"/>
    <circle cx="100" cy="74" r="7.5" fill="url(#windowGlow)"/>
    <line x1="100" y1="67" x2="100" y2="81" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="93" y1="74" x2="107" y2="74" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <!-- ================= WELCOMING FRONT DOOR ================= -->
  <g id="house-door" transform="translate(88, 114)">
    <!-- Door Frame -->
    <rect x="0" y="0" width="24" height="34" rx="3" fill="#451A03"/>
    <!-- Door Leaf -->
    <rect x="1.5" y="1.5" width="21" height="32.5" rx="2" fill="url(#woodDoor)"/>
    <!-- Inset Wood Panels -->
    <rect x="4" y="4" width="16" height="12" rx="1.5" fill="#78350F" stroke="#B45309" stroke-width="1"/>
    <rect x="4" y="18" width="16" height="13" rx="1.5" fill="#78350F" stroke="#B45309" stroke-width="1"/>
    <!-- Polished Brass Door Knob -->
    <circle cx="6" cy="18" r="2" fill="#FDE047"/>
    <circle cx="5.5" cy="17.5" r="0.8" fill="#FFFFFF"/>
    <!-- Welcome Mat -->
    <rect x="-2" y="34" width="28" height="3" rx="1" fill="#78350F"/>
  </g>

  <!-- ================= GLOWING 4-PANE WINDOWS ================= -->
  <!-- Left Window with Flower Planter Box -->
  <g id="window-left" transform="translate(58, 108)">
    <rect x="0" y="0" width="22" height="24" rx="2" fill="#1E293B"/>
    <rect x="1.5" y="1.5" width="19" height="21" rx="1.5" fill="url(#windowGlow)"/>
    <!-- Window Glazing Bars (Mullions) -->
    <line x1="11" y1="2" x2="11" y2="22" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="2" y1="12" x2="20" y2="12" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Window Sill & Flower Box -->
    <rect x="-2" y="23" width="26" height="5" rx="1.5" fill="#78350F"/>
    <!-- Flowers in Box -->
    <circle cx="2" cy="22" r="2.5" fill="#F43F5E"/>
    <circle cx="8" cy="21" r="2.8" fill="#FACC15"/>
    <circle cx="14" cy="22" r="2.5" fill="#F43F5E"/>
    <circle cx="20" cy="21" r="2.8" fill="#38BDF8"/>
  </g>

  <!-- Right Window with Flower Planter Box -->
  <g id="window-right" transform="translate(120, 108)">
    <rect x="0" y="0" width="22" height="24" rx="2" fill="#1E293B"/>
    <rect x="1.5" y="1.5" width="19" height="21" rx="1.5" fill="url(#windowGlow)"/>
    <line x1="11" y1="2" x2="11" y2="22" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="2" y1="12" x2="20" y2="12" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="-2" y="23" width="26" height="5" rx="1.5" fill="#78350F"/>
    <circle cx="2" cy="22" r="2.5" fill="#38BDF8"/>
    <circle cx="8" cy="21" r="2.8" fill="#FACC15"/>
    <circle cx="14" cy="22" r="2.5" fill="#F43F5E"/>
    <circle cx="20" cy="21" r="2.8" fill="#FACC15"/>
  </g>

  <!-- ================= PLAYFUL CONSTRUCTION LADDER & TOOLS ================= -->
  <!-- Cute Wooden Builder's Ladder leaning against house -->
  <g id="builder-ladder" transform="translate(152, 96) rotate(16)">
    <!-- Rails -->
    <line x1="0" y1="0" x2="0" y2="58" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="10" y2="58" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <!-- Rungs -->
    <line x1="0" y1="10" x2="10" y2="10" stroke="#B45309" stroke-width="2"/>
    <line x1="0" y1="20" x2="10" y2="20" stroke="#B45309" stroke-width="2"/>
    <line x1="0" y1="30" x2="10" y2="30" stroke="#B45309" stroke-width="2"/>
    <line x1="0" y1="40" x2="10" y2="40" stroke="#B45309" stroke-width="2"/>
    <line x1="0" y1="50" x2="10" y2="50" stroke="#B45309" stroke-width="2"/>
  </g>

  <!-- Yellow Builder's Hard Hat on the grass -->
  <g id="builder-helmet" transform="translate(32, 160)">
    <ellipse cx="8" cy="10" rx="9" ry="2" fill="#020617" opacity="0.3"/>
    <path d="M0 8 C0 2, 16 2, 16 8 Z" fill="#FACC15"/>
    <ellipse cx="8" cy="8" rx="10" ry="2.5" fill="#EAB308"/>
    <path d="M4 6 C6 3, 10 3, 12 6" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Golden Celebration Sparkle -->
  <polygon points="100,32 102,36 106,38 102,40 100,44 98,40 94,38 98,36" fill="#FDE047"/>
</svg>
