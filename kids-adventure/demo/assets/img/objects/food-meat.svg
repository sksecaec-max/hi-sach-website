<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Kido original: a meaty drumstick (What's That Animal? food — "meat") -->
  <defs>
    <radialGradient id="mt-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B120C" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#1B120C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1B120C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mt-meat" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#F2A86B"/>
      <stop offset="40%" stop-color="#C8662E"/>
      <stop offset="80%" stop-color="#8E3B16"/>
      <stop offset="100%" stop-color="#5E2209"/>
    </radialGradient>
    <linearGradient id="mt-bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F3E9D8"/>
      <stop offset="100%" stop-color="#CDBB9E"/>
    </linearGradient>
    <linearGradient id="mt-spec" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="96" cy="182" rx="58" ry="11" fill="url(#mt-shadow)"/>

  <!-- Bone (behind the meat) -->
  <g transform="rotate(-38 100 100)">
    <rect x="112" y="91" width="58" height="18" rx="9" fill="url(#mt-bone)"/>
    <circle cx="168" cy="88" r="12" fill="url(#mt-bone)"/>
    <circle cx="168" cy="112" r="12" fill="url(#mt-bone)"/>
    <path d="M120 96 L160 96" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Meat -->
  <path d="M40 132 C24 104 36 66 72 56 C104 48 132 66 134 92 C136 116 120 128 112 140 C100 158 64 164 40 132 Z" fill="url(#mt-meat)"/>
  <!-- Crispy browned edge -->
  <path d="M46 140 C66 160 98 156 112 140" fill="none" stroke="#5E2209" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <!-- Highlights -->
  <ellipse cx="68" cy="80" rx="20" ry="9" transform="rotate(-25 68 80)" fill="url(#mt-spec)"/>
  <ellipse cx="98" cy="70" rx="8" ry="4" transform="rotate(-10 98 70)" fill="url(#mt-spec)"/>
</svg>
