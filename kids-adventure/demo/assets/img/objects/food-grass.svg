<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Kido original: a tuft of fresh grass (What's That Animal? food — "grass") -->
  <defs>
    <radialGradient id="gr-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B120C" stop-opacity="0.36"/>
      <stop offset="70%" stop-color="#1B120C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1B120C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gr-a" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="55%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#9CCC65"/>
    </linearGradient>
    <linearGradient id="gr-b" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="55%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#C5E1A5"/>
    </linearGradient>
    <radialGradient id="gr-soil" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="182" rx="62" ry="11" fill="url(#gr-shadow)"/>
  <ellipse cx="100" cy="170" rx="56" ry="12" fill="url(#gr-soil)"/>

  <!-- Back blades -->
  <path d="M60 170 C54 130 40 104 22 86 C46 96 66 124 74 168 Z" fill="url(#gr-b)"/>
  <path d="M86 170 C84 120 80 70 66 30 C88 62 98 116 98 168 Z" fill="url(#gr-a)"/>
  <path d="M112 170 C116 116 128 66 150 24 C138 72 128 118 124 168 Z" fill="url(#gr-b)"/>
  <path d="M138 170 C146 132 162 106 182 92 C164 112 154 136 150 168 Z" fill="url(#gr-a)"/>

  <!-- Front blades -->
  <path d="M70 172 C70 136 62 110 48 90 C70 106 82 136 84 170 Z" fill="url(#gr-a)"/>
  <path d="M96 172 C100 128 104 92 112 56 C118 96 114 132 110 170 Z" fill="url(#gr-b)"/>
  <path d="M120 172 C124 140 136 116 156 100 C142 122 134 146 132 170 Z" fill="url(#gr-b)"/>

  <!-- Light catching the blade edges -->
  <path d="M88 160 C88 120 84 80 74 46" fill="none" stroke="#E6F5C9" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M116 160 C120 120 128 82 144 40" fill="none" stroke="#E6F5C9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
