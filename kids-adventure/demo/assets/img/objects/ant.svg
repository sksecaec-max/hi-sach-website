<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft ground shadow -->
    <radialGradient id="ant-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B120C" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#1B120C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1B120C" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Glossy 3D Head Gradient -->
    <radialGradient id="ant-head" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="35%" stop-color="#D32F2F"/>
      <stop offset="75%" stop-color="#880E4F"/>
      <stop offset="100%" stop-color="#311B92"/>
    </radialGradient>
    
    <!-- Thorax Gradient -->
    <radialGradient id="ant-thorax" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="40%" stop-color="#D84315"/>
      <stop offset="85%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#212121"/>
    </radialGradient>

    <!-- Abdomen Gradient -->
    <radialGradient id="ant-abdomen" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="30%" stop-color="#C62828"/>
      <stop offset="70%" stop-color="#5C0011"/>
      <stop offset="100%" stop-color="#1A0006"/>
    </radialGradient>

    <!-- Specular highlight -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Leg Gradient -->
    <linearGradient id="ant-leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="50%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="102" cy="172" rx="72" ry="16" fill="url(#ant-shadow)" />

  <!-- Back Legs (darker depth) -->
  <g stroke="#3E2723" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Back-right leg -->
    <path d="M115 118 Q140 95 160 120 T172 165" />
    <!-- Mid-right leg -->
    <path d="M98 116 Q115 88 132 108 T145 168" />
    <!-- Front-right leg -->
    <path d="M80 118 Q90 85 105 102 T118 165" />
  </g>

  <!-- Front Legs (vibrant 3D) -->
  <g stroke="url(#ant-leg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Back-left leg -->
    <path d="M125 125 Q115 80 85 95 T48 168" />
    <!-- Mid-left leg -->
    <path d="M102 124 Q85 85 62 105 T28 162" />
    <!-- Front-left leg -->
    <path d="M85 125 Q68 95 50 110 T20 152" />
  </g>

  <!-- Abdomen (Rear segment - large bulbous oval) -->
  <g>
    <ellipse cx="138" cy="116" rx="38" ry="28" transform="rotate(18 138 116)" fill="url(#ant-abdomen)" />
    <!-- Abdomen rings / ridges -->
    <path d="M125 96 C138 98 148 108 152 125" stroke="#FF8A80" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M138 98 C150 102 160 114 163 128" stroke="#FF8A80" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
    <!-- Specular highlight -->
    <ellipse cx="130" cy="104" rx="18" ry="9" transform="rotate(15 130 104)" fill="url(#specular)" opacity="0.75" />
  </g>

  <!-- Petiole (waist connection) -->
  <ellipse cx="106" cy="122" rx="7" ry="5" fill="#4E342E" />

  <!-- Thorax (Middle segment) -->
  <g>
    <ellipse cx="96" cy="120" rx="18" ry="14" transform="rotate(-8 96 120)" fill="url(#ant-thorax)" />
    <ellipse cx="92" cy="114" rx="10" ry="5" fill="url(#specular)" opacity="0.65" />
  </g>

  <!-- Neck -->
  <ellipse cx="80" cy="118" rx="5" ry="4" fill="#3E2723" />

  <!-- Head (Front segment) -->
  <g>
    <ellipse cx="64" cy="114" rx="20" ry="16" transform="rotate(-15 64 114)" fill="url(#ant-head)" />
    <!-- Big cute glossy compound eye -->
    <ellipse cx="58" cy="106" rx="6.5" ry="7.5" fill="#1A0000" />
    <ellipse cx="58" cy="106" rx="6.5" ry="7.5" fill="url(#ant-head)" opacity="0.4" />
    <circle cx="56" cy="103" r="2.5" fill="#FFFFFF" />
    <circle cx="60" cy="108" r="1.2" fill="#FFFFFF" opacity="0.8" />

    <!-- Cute smiling mouth & small pincers -->
    <path d="M46 118 Q42 122 45 126 Q50 125 52 120" fill="#FF8A80" />
    <!-- Specular highlight on forehead -->
    <ellipse cx="66" cy="104" rx="10" ry="5" fill="url(#specular)" opacity="0.8" />
  </g>

  <!-- Antennae (with elbow joint) -->
  <g stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Left antenna -->
    <path d="M56 100 Q46 72 32 68 Q24 66 18 72" />
    <!-- Right antenna -->
    <path d="M62 98 Q58 68 48 55 Q42 48 34 52" />
  </g>
  <!-- Antenna tips -->
  <circle cx="18" cy="72" r="3.5" fill="#FF5252" />
  <circle cx="34" cy="52" r="3.5" fill="#FF5252" />
</svg>
