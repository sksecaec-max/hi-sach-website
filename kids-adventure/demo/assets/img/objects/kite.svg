<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowKite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topTri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bottomTri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="leftTri" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="rightTri" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="woodBamboo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="188" rx="55" ry="9" fill="url(#shadowKite)"/>

  <!-- Kite Main Diamond Body (Faceted 4 Quadrants) -->
  <g transform="translate(100, 78) rotate(-15) translate(-100, -78)">
    <!-- Top Quadrant -->
    <polygon points="100,15 150,78 100,78" fill="url(#topTri)"/>
    <polygon points="100,15 50,78 100,78" fill="#0EA5E9"/>

    <!-- Bottom Left Quadrant -->
    <polygon points="50,78 100,140 100,78" fill="url(#leftTri)"/>
    <!-- Bottom Right Quadrant -->
    <polygon points="150,78 100,140 100,78" fill="url(#bottomTri)"/>

    <!-- Bamboo Spine & Bow -->
    <!-- Vertical Spine -->
    <line x1="100" y1="12" x2="100" y2="145" stroke="url(#woodBamboo)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Curved Cross Bow -->
    <path d="M48 78 Q100 50 152 78" stroke="url(#woodBamboo)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Tail Triangular Flap -->
    <polygon points="88,140 112,140 100,156" fill="#F59E0B"/>

    <!-- Specular Gloss Highlight -->
    <polygon points="100,15 100,78 75,46" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Flowing Ribbon Tail with Colorful Bows -->
  <path d="M110 148 Q135 160 120 178 Q105 192 130 196" stroke="#EC4899" stroke-width="2.5" fill="none"/>
  <!-- Bow 1 -->
  <polygon points="120,165 132,160 125,168 132,176 120,171" fill="#FBBF24"/>
  <!-- Bow 2 -->
  <polygon points="112,185 100,180 107,188 100,196 112,191" fill="#38BDF8"/>
</svg>
