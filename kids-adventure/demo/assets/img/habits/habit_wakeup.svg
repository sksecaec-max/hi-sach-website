<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
    <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#BAE6FD"/>
      <stop offset="75%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="36" y="24" width="168" height="176" rx="20" fill="url(#skyDawn)" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Golden Rising Sun -->
  <circle cx="120" cy="130" r="44" fill="url(#sunGlow)"/>
  <!-- Beams -->
  <g stroke="#FDE047" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="72" x2="120" y2="60"/>
    <line x1="162" y1="88" x2="172" y2="80"/>
    <line x1="178" y1="130" x2="190" y2="130"/>
    <line x1="78" y1="88" x2="68" y2="80"/>
    <line x1="62" y1="130" x2="50" y2="130"/>
  </g>

  <!-- Green Rolling Hills outside window -->
  <path d="M38 160 C70 144, 110 156, 140 148 C170 140, 190 150, 202 154 L202 198 L38 198 Z" fill="#22C55E"/>
  <path d="M38 174 C80 162, 130 178, 202 166 L202 198 L38 198 Z" fill="#15803D"/>

  <!-- Flying Morning Birds -->
  <path d="M84 76 Q90 68, 96 76 Q102 68, 108 76" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <path d="M148 64 Q153 58, 158 64 Q163 58, 168 64" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Window Panes Cross -->
  <line x1="120" y1="24" x2="120" y2="200" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="36" y1="110" x2="204" y2="110" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Morning Window Sill & Alarm Clock -->
  <rect x="28" y="196" width="184" height="18" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Cute Alarm Clock on Sill -->
  <g transform="translate(156, 172)">
    <!-- Bells -->
    <circle cx="8" cy="8" r="6" fill="#EF4444"/>
    <circle cx="32" cy="8" r="6" fill="#EF4444"/>
    <!-- Body -->
    <circle cx="20" cy="20" r="16" fill="#EF4444"/>
    <circle cx="20" cy="20" r="12" fill="#FFFFFF"/>
    <!-- Clock Hands (7:00 AM) -->
    <line x1="20" y1="20" x2="20" y2="12" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="15" y2="26" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2" fill="#EF4444"/>
  </g>
</svg>
