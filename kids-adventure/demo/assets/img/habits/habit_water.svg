<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Soft Table Shadow -->
    <radialGradient id="glassShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <!-- Water Volume Gradient -->
    <linearGradient id="pureWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Glass Highlights -->
    <linearGradient id="glassShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#BAE6FD" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Lemon Slice -->
    <radialGradient id="lemonRind" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="75%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="214" rx="60" ry="14" fill="url(#glassShadow)"/>

  <!-- Back Glass Rim -->
  <path d="M76 56 L86 196 C87 204, 153 204, 154 196 L164 56 Z" fill="rgba(240, 249, 255, 0.4)" stroke="#BAE6FD" stroke-width="2.5"/>

  <!-- Water inside Glass -->
  <path d="M79 86 C90 82, 150 82, 161 86 L153 194 C152 201, 88 201, 87 194 Z" fill="url(#pureWater)"/>

  <!-- Floating Ice Cubes -->
  <rect x="94" y="90" width="28" height="28" rx="6" fill="#FFFFFF" opacity="0.65" transform="rotate(12 108 104)"/>
  <rect x="122" y="104" width="26" height="26" rx="6" fill="#E0F2FE" opacity="0.6" transform="rotate(-15 135 117)"/>

  <!-- Effervescent Water Bubbles -->
  <circle cx="102" cy="140" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="116" cy="165" r="4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="134" cy="150" r="3.5" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="124" cy="130" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="98" cy="175" r="3" fill="#FFFFFF" opacity="0.6"/>

  <!-- Juicy Fresh Lemon Wedge on Rim -->
  <g transform="translate(150, 48) rotate(32)">
    <path d="M0 0 A24 24 0 0 1 34 34 Z" fill="url(#lemonRind)"/>
    <path d="M4 4 A20 20 0 0 1 30 30 Z" fill="#FEF08A"/>
    <!-- Segments -->
    <path d="M6 6 L26 26" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M6 18 L26 12" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Glass Front Wall & Reflection -->
  <path d="M76 56 L86 196 C87 204, 153 204, 154 196 L164 56 Z" fill="url(#glassShimmer)" stroke="#E0F2FE" stroke-width="2.5"/>

  <!-- Vertical Light Streak -->
  <path d="M84 66 L91 190" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M92 68 L96 182" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Splash & Dew Droplets -->
  <circle cx="68" cy="142" r="3" fill="#38BDF8" opacity="0.9"/>
  <circle cx="170" cy="158" r="2.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="120" cy="40" r="3.5" fill="#38BDF8"/>
  <!-- Sparkles -->
  <path d="M64 74 L66 80 L72 82 L66 84 L64 90 L62 84 L56 82 L62 80 Z" fill="#FACC15"/>
</svg>
