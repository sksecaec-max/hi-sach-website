<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="helpShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#E11D48" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="214" rx="75" ry="14" fill="url(#helpShadow)"/>

  <!-- Warm Golden Heart in center -->
  <path d="M120 74 C110 50, 74 52, 74 84 C74 116, 120 148, 120 148 C120 148, 166 116, 166 84 C166 52, 130 50, 120 74 Z" fill="url(#heartGrad)"/>
  <!-- Highlight on heart -->
  <path d="M84 76 C84 66, 96 64, 104 70" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Helping Hand from left (Blue sleeve) -->
  <g transform="translate(42, 134)">
    <rect x="-14" y="10" width="34" height="24" rx="6" fill="#3B82F6"/>
    <!-- Arm & Hand -->
    <path d="M16 12 L50 20 C56 22, 60 28, 58 34 L54 44 C52 50, 44 52, 38 48 L14 34 Z" fill="#FBBF24"/>
    <!-- Fingers extending -->
    <rect x="48" y="18" width="22" height="7" rx="3.5" fill="#FBBF24" transform="rotate(10 48 18)"/>
    <rect x="50" y="26" width="23" height="7" rx="3.5" fill="#F59E0B" transform="rotate(12 50 26)"/>
    <rect x="46" y="34" width="22" height="7" rx="3.5" fill="#D97706" transform="rotate(14 46 34)"/>
  </g>

  <!-- Reaching Hand from right (Green sleeve) -->
  <g transform="translate(198, 134) scale(-1, 1)">
    <rect x="-14" y="10" width="34" height="24" rx="6" fill="#10B981"/>
    <path d="M16 12 L50 20 C56 22, 60 28, 58 34 L54 44 C52 50, 44 52, 38 48 L14 34 Z" fill="#F59E0B"/>
    <rect x="48" y="18" width="22" height="7" rx="3.5" fill="#FBBF24" transform="rotate(10 48 18)"/>
    <rect x="50" y="26" width="23" height="7" rx="3.5" fill="#FBBF24" transform="rotate(12 50 26)"/>
    <rect x="46" y="34" width="22" height="7" rx="3.5" fill="#F59E0B" transform="rotate(14 46 34)"/>
  </g>

  <!-- Sparkles -->
  <path d="M120 34 L122 40 L128 42 L122 44 L120 50 L118 44 L112 42 L118 40 Z" fill="#FACC15"/>
  <path d="M52 64 L54 70 L60 72 L54 74 L52 80 L50 74 L44 72 L50 70 Z" fill="#38BDF8"/>
  <path d="M188 64 L190 70 L196 72 L190 74 L188 80 L186 74 L180 72 L186 70 Z" fill="#FACC15"/>
</svg>
