<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="combShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brushWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="combColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="214" rx="75" ry="14" fill="url(#combShadow)"/>

  <!-- Wooden Hairbrush -->
  <g transform="translate(100, 110) rotate(-35)">
    <!-- Handle -->
    <path d="M-8 40 L-10 100 C-10 108, 10 108, 10 100 L8 40 Z" fill="url(#brushWood)"/>
    <!-- Brush Paddle Base -->
    <ellipse cx="0" cy="0" rx="36" ry="50" fill="url(#brushWood)"/>
    <!-- Cushion Bed -->
    <ellipse cx="0" cy="0" rx="28" ry="42" fill="#334155"/>
    <!-- Bristles with soft tips -->
    <circle cx="-16" cy="-22" r="3" fill="#F8FAFC"/><circle cx="-16" cy="-22" r="1.5" fill="#38BDF8"/>
    <circle cx="0" cy="-26" r="3" fill="#F8FAFC"/><circle cx="0" cy="-26" r="1.5" fill="#38BDF8"/>
    <circle cx="16" cy="-22" r="3" fill="#F8FAFC"/><circle cx="16" cy="-22" r="1.5" fill="#38BDF8"/>
    <circle cx="-20" cy="0" r="3" fill="#F8FAFC"/><circle cx="-20" cy="0" r="1.5" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="3.5" fill="#F8FAFC"/><circle cx="0" cy="0" r="1.8" fill="#38BDF8"/>
    <circle cx="20" cy="0" r="3" fill="#F8FAFC"/><circle cx="20" cy="0" r="1.5" fill="#38BDF8"/>
    <circle cx="-16" cy="22" r="3" fill="#F8FAFC"/><circle cx="-16" cy="22" r="1.5" fill="#38BDF8"/>
    <circle cx="0" cy="26" r="3" fill="#F8FAFC"/><circle cx="0" cy="26" r="1.5" fill="#38BDF8"/>
    <circle cx="16" cy="22" r="3" fill="#F8FAFC"/><circle cx="16" cy="22" r="1.5" fill="#38BDF8"/>
  </g>

  <!-- Blue Styling Comb beside brush -->
  <g transform="translate(135, 120) rotate(40)">
    <!-- Comb Spine -->
    <rect x="-8" y="-55" width="16" height="110" rx="8" fill="url(#combColor)"/>
    <!-- Comb Teeth -->
    <path d="M-8 -46 L-30 -46 M-8 -38 L-30 -38 M-8 -30 L-30 -30 M-8 -22 L-30 -22 M-8 -14 L-30 -14 M-8 -6 L-30 -6 M-8 2 L-30 2 M-8 10 L-30 10 M-8 18 L-30 18 M-8 26 L-30 26 M-8 34 L-30 34 M-8 42 L-30 42" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Shimmering Sparkles -->
  <path d="M60 64 L62 70 L68 72 L62 74 L60 80 L58 74 L52 72 L58 70 Z" fill="#FACC15"/>
  <path d="M184 76 L185 80 L189 81 L185 82 L184 86 L183 82 L179 81 L183 80 Z" fill="#38BDF8"/>
</svg>
