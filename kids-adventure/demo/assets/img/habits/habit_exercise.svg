<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="ballShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.3"/>
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soccerBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="sneakerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="214" rx="85" ry="16" fill="url(#ballShadow)"/>

  <!-- Grass Patch -->
  <path d="M30 206 C60 196, 180 196, 210 206 L210 220 L30 220 Z" fill="#22C55E"/>

  <!-- Cheerful Sports Soccer Ball -->
  <circle cx="86" cy="144" r="42" fill="url(#soccerBall)"/>
  <!-- Pentagons on ball -->
  <polygon points="86,120 96,128 92,140 80,140 76,128" fill="#1E293B"/>
  <polygon points="86,168 94,162 104,166 102,176 90,178" fill="#1E293B"/>
  <polygon points="62,142 56,150 60,160 70,158 72,148" fill="#1E293B"/>
  <polygon points="110,142 116,150 112,160 102,158 100,148" fill="#1E293B"/>

  <!-- Active Kid's Running Sneaker -->
  <g transform="translate(130, 130)">
    <!-- Sole -->
    <path d="M4 64 C20 62, 65 62, 78 64 C82 64, 82 72, 76 74 C60 76, 16 76, -4 74 C-8 74, -6 66, 4 64 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Red Body of Shoe -->
    <path d="M0 64 C-2 50, 10 40, 20 28 C24 22, 34 22, 38 28 L46 44 L66 52 C74 56, 76 62, 76 64 Z" fill="url(#sneakerGrad)"/>
    <!-- White Toe Cap -->
    <path d="M58 52 C66 54, 76 58, 76 64 L50 64 Z" fill="#FFFFFF"/>
    <!-- Laces -->
    <line x1="28" y1="36" x2="38" y2="40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="44" x2="42" y2="48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Sporty swoosh -->
    <path d="M12 52 C24 50, 42 54, 52 48" stroke="#FDE047" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Energy Action Speed Sparks -->
  <path d="M116 80 L120 70 M130 84 L140 76 M140 96 L152 92" stroke="#FACC15" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Big Golden Star -->
  <path d="M174 54 L177 62 L185 64 L179 70 L181 78 L174 74 L167 78 L169 70 L163 64 L171 62 Z" fill="#FACC15"/>
</svg>
