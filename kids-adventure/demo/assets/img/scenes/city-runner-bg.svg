<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" preserveAspectRatio="none">
  <defs>
    <!-- Sky & Distant Atmosphere -->
    <linearGradient id="citySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#BAE6FD"/>
      <stop offset="80%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>

    <!-- Distant Skyline Silhouette Gradient -->
    <linearGradient id="distSkyline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Brick Brownstone Gradient -->
    <linearGradient id="bldgBrick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Modern Glass Tower Gradient -->
    <linearGradient id="bldgGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Art Deco Hotel Stone Gradient -->
    <linearGradient id="bldgStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Loft Brick Building -->
    <linearGradient id="bldgLoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Deep Blue Night/Corporate Tower -->
    <linearGradient id="bldgBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Tree Foliage 3D Gradient -->
    <radialGradient id="treeCanopy" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="85%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>

    <!-- Road Asphalt Gradient -->
    <linearGradient id="asphaltRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="15%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Concrete Sidewalk -->
    <linearGradient id="sidewalkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Warm Glowing Window -->
    <radialGradient id="litWindow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="60%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect x="0" y="0" width="800" height="235" fill="url(#citySky)"/>

  <!-- DISTANT SKYLINE (Parallax Silhouettes) -->
  <g opacity="0.45" fill="url(#distSkyline)">
    <!-- Tower 1 -->
    <rect x="20" y="70" width="45" height="150"/>
    <polygon points="42,40 38,70 47,70"/>
    <!-- Tower 2 -->
    <rect x="80" y="55" width="60" height="165"/>
    <rect x="95" y="42" width="30" height="15"/>
    <line x1="110" y1="24" x2="110" y2="42" stroke="#6366F1" stroke-width="2"/>
    <!-- Tower 3 -->
    <rect x="160" y="85" width="50" height="135"/>
    <!-- Tower 4 (Stepped) -->
    <rect x="230" y="65" width="65" height="155"/>
    <rect x="245" y="48" width="35" height="18"/>
    <rect x="255" y="32" width="15" height="16"/>
    <!-- Tower 5 -->
    <rect x="320" y="75" width="55" height="145"/>
    <!-- Tower 6 -->
    <rect x="400" y="50" width="70" height="170"/>
    <polygon points="435,28 425,50 445,50"/>
    <!-- Tower 7 -->
    <rect x="495" y="80" width="50" height="140"/>
    <!-- Tower 8 -->
    <rect x="565" y="60" width="60" height="160"/>
    <rect x="585" y="45" width="20" height="16"/>
    <!-- Tower 9 -->
    <rect x="650" y="72" width="65" height="148"/>
    <!-- Tower 10 -->
    <rect x="735" y="58" width="55" height="162"/>
    <line x1="762" y1="34" x2="762" y2="58" stroke="#6366F1" stroke-width="2"/>
  </g>

  <!-- MIDGROUND PIXAR CITY BUILDINGS (Detailed Architecture) -->

  <!-- BUILDING 1 (0 to 125): Classic Red Brick Brownstone with Cornice & Fire Escape -->
  <g>
    <rect x="0" y="75" width="125" height="150" fill="url(#bldgBrick)"/>
    <!-- Roof Cornice with Dentils -->
    <rect x="-5" y="70" width="135" height="8" rx="2" fill="#7F1D1D"/>
    <line x1="0" y1="78" x2="125" y2="78" stroke="#FEF2F2" stroke-width="1.5" opacity="0.4"/>
    <!-- Stone Window Ledges & Lit Windows -->
    <g fill="url(#litWindow)">
      <rect x="14" y="90" width="18" height="24" rx="3"/>
      <rect x="42" y="90" width="18" height="24" rx="3"/>
      <rect x="70" y="90" width="18" height="24" rx="3"/>
      <rect x="98" y="90" width="18" height="24" rx="3"/>
      <rect x="14" y="126" width="18" height="24" rx="3"/>
      <rect x="42" y="126" width="18" height="24" rx="3"/>
      <rect x="70" y="126" width="18" height="24" rx="3"/>
      <rect x="98" y="126" width="18" height="24" rx="3"/>
      <rect x="14" y="162" width="18" height="24" rx="3"/>
      <rect x="42" y="162" width="18" height="24" rx="3"/>
      <rect x="70" y="162" width="18" height="24" rx="3"/>
      <rect x="98" y="162" width="18" height="24" rx="3"/>
    </g>
    <!-- Window Frames Grid -->
    <g stroke="#7F1D1D" stroke-width="1.2">
      <line x1="23" y1="90" x2="23" y2="114"/><line x1="14" y1="102" x2="32" y2="102"/>
      <line x1="51" y1="90" x2="51" y2="114"/><line x1="42" y1="102" x2="60" y2="102"/>
      <line x1="79" y1="90" x2="79" y2="114"/><line x1="70" y1="102" x2="88" y2="102"/>
      <line x1="107" y1="90" x2="107" y2="114"/><line x1="98" y1="102" x2="116" y2="102"/>
      <line x1="23" y1="126" x2="23" y2="150"/><line x1="14" y1="138" x2="32" y2="138"/>
      <line x1="51" y1="126" x2="51" y2="150"/><line x1="42" y1="138" x2="60" y2="138"/>
      <line x1="79" y1="126" x2="79" y2="150"/><line x1="70" y1="138" x2="88" y2="138"/>
      <line x1="107" y1="126" x2="107" y2="150"/><line x1="98" y1="138" x2="116" y2="138"/>
    </g>
    <!-- Fire Escape Metal Balconies -->
    <rect x="66" y="112" width="26" height="5" fill="#18181B"/>
    <rect x="66" y="148" width="26" height="5" fill="#18181B"/>
    <line x1="90" y1="117" x2="70" y2="148" stroke="#18181B" stroke-width="1.5"/>
  </g>

  <!-- BUILDING 2 (125 to 235): Modern Blue Glass High-Rise -->
  <g>
    <rect x="125" y="45" width="110" height="180" fill="url(#bldgGlass)"/>
    <!-- Glass Curtain Wall Lines -->
    <g stroke="#BAE6FD" stroke-width="1" opacity="0.65">
      <line x1="147" y1="45" x2="147" y2="225"/>
      <line x1="169" y1="45" x2="169" y2="225"/>
      <line x1="191" y1="45" x2="191" y2="225"/>
      <line x1="213" y1="45" x2="213" y2="225"/>
      <line x1="125" y1="65" x2="235" y2="65"/>
      <line x1="125" y1="88" x2="235" y2="88"/>
      <line x1="125" y1="112" x2="235" y2="112"/>
      <line x1="125" y1="136" x2="235" y2="136"/>
      <line x1="125" y1="160" x2="235" y2="160"/>
      <line x1="125" y1="184" x2="235" y2="184"/>
      <line x1="125" y1="208" x2="235" y2="208"/>
    </g>
    <!-- Diagonal Glass Reflective Sun Glare -->
    <polygon points="125,75 190,45 210,45 125,120" fill="#FFFFFF" opacity="0.22"/>
    <polygon points="150,160 235,100 235,125 170,180" fill="#FFFFFF" opacity="0.15"/>
    <!-- Rooftop Helipad / Antenna -->
    <rect x="160" y="38" width="40" height="7" rx="2" fill="#0369A1"/>
    <line x1="180" y1="18" x2="180" y2="38" stroke="#EF4444" stroke-width="2"/>
    <circle cx="180" cy="18" r="2.5" fill="#EF4444"/>
  </g>

  <!-- BUILDING 3 (235 to 370): Golden Art Deco Hotel & Bakery with Striped Awning -->
  <g>
    <rect x="235" y="60" width="135" height="165" fill="url(#bldgStone)"/>
    <!-- Stepped Deco Cornice -->
    <polygon points="235,60 260,44 345,44 370,60" fill="#CA8A04"/>
    <rect x="280" y="32" width="45" height="12" rx="2" fill="#EAB308"/>
    <!-- Elegant Arched Windows -->
    <g fill="#FEF9C3">
      <path d="M250 82 A 10 10 0 0 1 270 82 L270 104 L250 104 Z"/>
      <path d="M280 82 A 10 10 0 0 1 300 82 L300 104 L280 104 Z"/>
      <path d="M310 82 A 10 10 0 0 1 330 82 L330 104 L310 104 Z"/>
      <path d="M340 82 A 10 10 0 0 1 360 82 L360 104 L340 104 Z"/>
      <path d="M250 120 A 10 10 0 0 1 270 120 L270 142 L250 142 Z"/>
      <path d="M280 120 A 10 10 0 0 1 300 120 L300 142 L280 142 Z"/>
      <path d="M310 120 A 10 10 0 0 1 330 120 L330 142 L310 142 Z"/>
      <path d="M340 120 A 10 10 0 0 1 360 120 L360 142 L340 142 Z"/>
    </g>
    <!-- Ground Floor Shop Awning (Striped Red & White) -->
    <polygon points="235,178 370,178 365,198 240,198" fill="#EF4444"/>
    <polygon points="250,178 265,178 262,198 248,198" fill="#FFFFFF"/>
    <polygon points="280,178 295,178 292,198 278,198" fill="#FFFFFF"/>
    <polygon points="310,178 325,178 322,198 308,198" fill="#FFFFFF"/>
    <polygon points="340,178 355,178 352,198 338,198" fill="#FFFFFF"/>
    <rect x="250" y="200" width="45" height="25" fill="#FEF08A" stroke="#78350F" stroke-width="1.5"/>
    <rect x="310" y="200" width="45" height="25" fill="#FEF08A" stroke="#78350F" stroke-width="1.5"/>
  </g>

  <!-- BUILDING 4 (370 to 490): Charming Rose Loft with Roof Water Tank -->
  <g>
    <rect x="370" y="80" width="120" height="145" fill="url(#bldgLoft)"/>
    <rect x="366" y="74" width="128" height="8" rx="2" fill="#881337"/>
    <!-- Water Tank on Wooden Stilts -->
    <rect x="440" y="52" width="30" height="22" rx="3" fill="#78350F"/>
    <line x1="445" y1="74" x2="445" y2="78" stroke="#451A03" stroke-width="2"/>
    <line x1="465" y1="74" x2="465" y2="78" stroke="#451A03" stroke-width="2"/>
    <polygon points="440,52 455,42 470,52" fill="#451A03"/>
    <!-- Loft Windows -->
    <g fill="url(#litWindow)">
      <rect x="385" y="96" width="22" height="26" rx="2"/>
      <rect x="420" y="96" width="22" height="26" rx="2"/>
      <rect x="455" y="96" width="22" height="26" rx="2"/>
      <rect x="385" y="136" width="22" height="26" rx="2"/>
      <rect x="420" y="136" width="22" height="26" rx="2"/>
      <rect x="455" y="136" width="22" height="26" rx="2"/>
      <rect x="385" y="176" width="22" height="26" rx="2"/>
      <rect x="420" y="176" width="22" height="26" rx="2"/>
      <rect x="455" y="176" width="22" height="26" rx="2"/>
    </g>
  </g>

  <!-- BUILDING 5 (490 to 640): Corporate Blue Headquarters with Penthouse -->
  <g>
    <rect x="490" y="40" width="150" height="185" fill="url(#bldgBlue)"/>
    <rect x="525" y="24" width="80" height="16" rx="2" fill="#1E3A8A"/>
    <!-- Grid of Lit Corporate Windows -->
    <g fill="#FEF9C3">
      <rect x="506" y="55" width="16" height="14" rx="2"/><rect x="532" y="55" width="16" height="14" rx="2"/>
      <rect x="558" y="55" width="16" height="14" rx="2"/><rect x="584" y="55" width="16" height="14" rx="2"/>
      <rect x="610" y="55" width="16" height="14" rx="2"/>
      <rect x="506" y="80" width="16" height="14" rx="2"/><rect x="532" y="80" width="16" height="14" rx="2"/>
      <rect x="558" y="80" width="16" height="14" rx="2"/><rect x="584" y="80" width="16" height="14" rx="2"/>
      <rect x="610" y="80" width="16" height="14" rx="2"/>
      <rect x="506" y="105" width="16" height="14" rx="2"/><rect x="532" y="105" width="16" height="14" rx="2"/>
      <rect x="558" y="105" width="16" height="14" rx="2"/><rect x="584" y="105" width="16" height="14" rx="2"/>
      <rect x="610" y="105" width="16" height="14" rx="2"/>
      <rect x="506" y="130" width="16" height="14" rx="2"/><rect x="532" y="130" width="16" height="14" rx="2"/>
      <rect x="558" y="130" width="16" height="14" rx="2"/><rect x="584" y="130" width="16" height="14" rx="2"/>
      <rect x="610" y="130" width="16" height="14" rx="2"/>
      <rect x="506" y="155" width="16" height="14" rx="2"/><rect x="532" y="155" width="16" height="14" rx="2"/>
      <rect x="558" y="155" width="16" height="14" rx="2"/><rect x="584" y="155" width="16" height="14" rx="2"/>
      <rect x="610" y="155" width="16" height="14" rx="2"/>
    </g>
  </g>

  <!-- BUILDING 6 (640 to 800): Historic Townhouse with Arched Windows & Gables -->
  <g>
    <rect x="640" y="70" width="160" height="155" fill="url(#bldgBrick)"/>
    <polygon points="660,70 690,48 720,70" fill="#7F1D1D"/>
    <polygon points="740,70 770,48 800,70" fill="#7F1D1D"/>
    <!-- Windows -->
    <g fill="url(#litWindow)">
      <rect x="655" y="85" width="20" height="24" rx="2"/>
      <rect x="685" y="85" width="20" height="24" rx="2"/>
      <rect x="715" y="85" width="20" height="24" rx="2"/>
      <rect x="745" y="85" width="20" height="24" rx="2"/>
      <rect x="775" y="85" width="20" height="24" rx="2"/>
      <rect x="655" y="125" width="20" height="24" rx="2"/>
      <rect x="685" y="125" width="20" height="24" rx="2"/>
      <rect x="715" y="125" width="20" height="24" rx="2"/>
      <rect x="745" y="125" width="20" height="24" rx="2"/>
      <rect x="775" y="125" width="20" height="24" rx="2"/>
      <rect x="655" y="165" width="20" height="24" rx="2"/>
      <rect x="685" y="165" width="20" height="24" rx="2"/>
      <rect x="715" y="165" width="20" height="24" rx="2"/>
      <rect x="745" y="165" width="20" height="24" rx="2"/>
      <rect x="775" y="165" width="20" height="24" rx="2"/>
    </g>
  </g>

  <!-- STREET SIDEWALK GREENERY & TREES (Pixar Foliage) -->
  <!-- Tree 1 at x=115 -->
  <g>
    <rect x="117" y="185" width="6" height="40" fill="#78350F" rx="2"/>
    <circle cx="120" cy="180" r="22" fill="url(#treeCanopy)"/>
    <circle cx="112" cy="172" r="14" fill="#86EFAC" opacity="0.35"/>
  </g>
  <!-- Tree 2 at x=362 -->
  <g>
    <rect x="364" y="185" width="6" height="40" fill="#78350F" rx="2"/>
    <circle cx="367" cy="180" r="24" fill="url(#treeCanopy)"/>
    <circle cx="359" cy="170" r="15" fill="#86EFAC" opacity="0.35"/>
  </g>
  <!-- Tree 3 at x=632 -->
  <g>
    <rect x="634" y="185" width="6" height="40" fill="#78350F" rx="2"/>
    <circle cx="637" cy="180" r="23" fill="url(#treeCanopy)"/>
    <circle cx="629" cy="172" r="14" fill="#86EFAC" opacity="0.35"/>
  </g>

  <!-- CLASSIC ORNATE STREET LAMP POSTS (Warm Ambient Light) -->
  <g stroke="#18181B" stroke-width="2" fill="none">
    <!-- Lamp 1 at x=228 -->
    <line x1="228" y1="180" x2="228" y2="226"/>
    <circle cx="228" cy="176" r="5" fill="#FEF08A" stroke="#CA8A04"/>
    <circle cx="228" cy="176" r="10" fill="#FDE047" opacity="0.25" stroke="none"/>
    <!-- Lamp 2 at x=485 -->
    <line x1="485" y1="180" x2="485" y2="226"/>
    <circle cx="485" cy="176" r="5" fill="#FEF08A" stroke="#CA8A04"/>
    <circle cx="485" cy="176" r="10" fill="#FDE047" opacity="0.25" stroke="none"/>
  </g>

  <!-- SIDEWALK & STONE CURB -->
  <rect x="0" y="222" width="800" height="12" fill="url(#sidewalkGrad)"/>
  <!-- Sidewalk Tile Grooves -->
  <g stroke="#94A3B8" stroke-width="1.2">
    <line x1="40" y1="222" x2="40" y2="234"/>
    <line x1="120" y1="222" x2="120" y2="234"/>
    <line x1="200" y1="222" x2="200" y2="234"/>
    <line x1="280" y1="222" x2="280" y2="234"/>
    <line x1="360" y1="222" x2="360" y2="234"/>
    <line x1="440" y1="222" x2="440" y2="234"/>
    <line x1="520" y1="222" x2="520" y2="234"/>
    <line x1="600" y1="222" x2="600" y2="234"/>
    <line x1="680" y1="222" x2="680" y2="234"/>
    <line x1="760" y1="222" x2="760" y2="234"/>
  </g>
  <!-- Curb Highlight & Drop Shadow -->
  <rect x="0" y="232" width="800" height="3" fill="#E2E8F0"/>
  <rect x="0" y="234" width="800" height="2" fill="#64748B"/>

  <!-- ASPHALT ROAD SURFACE (Where characters run) -->
  <rect x="0" y="235" width="800" height="65" fill="url(#asphaltRoad)"/>

  <!-- Top Solid White Shoulder Line -->
  <line x1="0" y1="240" x2="800" y2="240" stroke="#F8FAFC" stroke-width="2" opacity="0.85"/>

  <!-- Bottom Solid White Edge Line -->
  <line x1="0" y1="295" x2="800" y2="295" stroke="#F8FAFC" stroke-width="2" opacity="0.85"/>

  <!-- DASHED YELLOW CENTER LANE MARKINGS (Continuous Highway Lines) -->
  <g stroke="#FACC15" stroke-width="4.5" stroke-linecap="round">
    <line x1="15" y1="268" x2="65" y2="268"/>
    <line x1="115" y1="268" x2="165" y2="268"/>
    <line x1="215" y1="268" x2="265" y2="268"/>
    <line x1="315" y1="268" x2="365" y2="268"/>
    <line x1="415" y1="268" x2="465" y2="268"/>
    <line x1="515" y1="268" x2="565" y2="268"/>
    <line x1="615" y1="268" x2="665" y2="268"/>
    <line x1="715" y1="268" x2="765" y2="268"/>
  </g>
</svg>
